<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalibrasyon Masası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Kalibrasyon çözeltisi hazırlama: cihaz derslerindeki gibi adım adım (sağda ders paneli, Devam ile ilerler) */
:root{--bg:#0E1518;--card:#1E2A30;--card2:#25333A;--line:#34454D;--ink:#EAF2F3;--muted:#9BB0B6;--blue:#2F7DE1;--ok:#2DBE5B;--bad:#E5484D;--warn:#F2B632;--teal:#2BD9C0;
 --f-display:'Barlow Condensed',system-ui,sans-serif;--f-body:'Source Sans 3',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 30% 0%,#1A2A30,var(--bg) 60%);color:var(--ink);font-family:var(--f-body);min-height:100vh}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.sahne{position:fixed;inset:0 390px 0 0;overflow:auto;padding:12px 16px 40px}
.hdr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}.brand b{font:700 24px/1 var(--f-display)}.brand b i{font-style:normal;color:var(--teal)}
.pill{font:600 10.5px var(--f-mono);letter-spacing:.1em;border-radius:999px;padding:4px 9px;background:var(--warn);color:#2A2000}
.hdr a{color:#7FDCD0;font-weight:600;font-size:14px}
.masa{max-width:900px;margin:0 auto;display:grid;gap:14px}
.kutu{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kutu h3{font:700 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:#7FDCD0;margin-bottom:10px}
/* seyreltme zinciri */
.zincir{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.halka{flex:1 1 110px;min-width:0;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:10px;text-align:center;transition:.3s}
.halka small{display:block;font:600 10.5px var(--f-mono);letter-spacing:.08em;color:var(--muted)}
.halka b{display:block;font:700 22px var(--f-display);margin:2px 0}.halka span{font-size:12.5px;color:#C7D6DA}
.halka.on{border-color:var(--warn);box-shadow:0 0 0 3px rgba(242,182,50,.2),0 0 18px rgba(242,182,50,.35)}
.halka.tam{border-color:var(--ok)}.halka.tam b::after{content:" ✓";color:var(--ok);font-size:16px}
.ok-ar{align-self:center;color:#6F858C;font-size:20px}
/* plan tablosu */
table{width:100%;border-collapse:collapse;font-size:14px}th{font:600 10.5px var(--f-mono);letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #26343A}td.g{font-weight:700}td.bos{color:#556870}tr.on td{background:rgba(242,182,50,.08)}tr.tam td.v{color:#8FE0A8;font-weight:700}
.birim{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.birim div{background:var(--card2);border-radius:10px;padding:8px 4px}.birim b{display:block;font:700 18px var(--f-display)}.birim small{color:var(--muted);font-size:12px}
.birim div.on{outline:2px solid var(--warn)}
.formul{font:600 22px var(--f-mono);text-align:center;padding:8px;background:var(--card2);border-radius:12px}.formul small{display:block;font:400 13px var(--f-body);color:var(--muted);margin-top:4px}
/* ders paneli */
#dersK{position:fixed;z-index:20;top:0;right:0;bottom:0;width:390px;overflow:auto;padding:14px;background:#1E2A30;box-shadow:-10px 0 30px rgba(0,0,0,.35)}
#P{display:grid;gap:10px;font:15px/1.45 var(--f-body);color:#D7E4E7}
.ust{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.ust b{font:700 19px var(--f-display);color:#EAF2F3}.ust span{font:600 11px var(--f-mono);color:#9BB0B6;white-space:nowrap}
.bol{display:flex;gap:4px}.bol i{flex:1 1 0;min-width:0;font:600 10px var(--f-mono);font-style:normal;text-align:center;color:#6F858C;border-top:3px solid #33444C;padding-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bol i.g{border-color:#2DBE5B;color:#8FE0A8}.bol i.s{border-color:#2BD9C0;color:#EAF2F3}
.ask{background:#F1F6F7;color:#16242A;border-radius:12px;padding:11px 13px;border-left:5px solid #F2B632;font-size:16px}.ask.tamam{border-left-color:#2DBE5B;background:#E6F6EB}
.ask small{display:block;margin-top:6px;color:#B3261E;font-weight:600;font-size:13.5px}
.giris{display:flex;gap:8px;align-items:center}.giris input{flex:1;min-width:0;background:#0E1518;border:2px solid #34454D;border-radius:10px;padding:10px 12px;font:600 18px var(--f-mono);color:#EAF2F3}
.giris input:focus{outline:none;border-color:var(--teal)}.giris .u{font:600 14px var(--f-mono);color:#9BB0B6;min-width:52px}
.kart{background:#25333A;border-radius:12px;padding:12px 13px;display:grid;gap:8px}.kart h4{font:700 18px var(--f-display);color:#2BD9C0;letter-spacing:.02em}
.kart p+p,.kart p+ul,.kart ul+p{margin-top:2px}.kart ul{margin-left:18px;display:grid;gap:3px}.kart .hes{font:600 14px var(--f-mono);background:#16242A;border-radius:8px;padding:8px 10px;color:#7CF2D8}
.alt{display:flex;gap:8px;flex-wrap:wrap}
#P button{border:0;border-radius:10px;padding:10px 14px;font:700 14.5px var(--f-body);background:#33444C;color:#EAF2F3}
#P button.p{background:#2F7DE1;flex:1}#P button.k{background:#F2B632;color:#2A2000;flex:1}#P button:disabled{opacity:.4;cursor:default}
#P button.ince{background:none;color:#9BB0B6;font-weight:600;font-size:13px;padding:4px}
.sec{display:grid;gap:6px}.sec button{text-align:left;font-weight:600!important}.sec button.d{background:#1F7A3D!important}.sec button.y{background:#8E2A2E!important}
.hes s{text-decoration-thickness:2px;text-decoration-color:#FF6B6B;color:#9BB0B6}.hes .kal{color:#F2B632;font-weight:700}
.hsat{display:grid;gap:6px;background:#16242A;border-radius:10px;padding:8px 10px}.hsat label{font:600 10.5px var(--f-mono);letter-spacing:.08em;color:#9BB0B6}.hsat .sat{display:flex;gap:6px;align-items:center}.hsat input{flex:1;min-width:0;background:#0E1518;border:1px solid #34454D;border-radius:8px;padding:7px 9px;font:600 15px var(--f-mono);color:#EAF2F3}.hsat output{font:700 15px var(--f-mono);color:#7CF2D8;min-width:70px;text-align:right}
#P .hsat button{padding:6px 10px;font-size:13px}
.mentor{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:#F1F6F7;color:#16242A;border-radius:12px;padding:9px 12px;border-left:5px solid var(--teal)}
.mentor img{width:44px;height:44px;border-radius:50%;object-fit:cover}.mentor .nm{font:600 10.5px var(--f-mono);color:#1F9A97;letter-spacing:.08em}.mentor p{font-size:14px;line-height:1.4}
@media (max-width:900px){.sahne{inset:0 0 50dvh 0}#dersK{top:auto;left:0;width:auto;height:50dvh;border-radius:16px 16px 0 0;padding:10px 12px}.birim{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="sahne">
 <div class="hdr"><div class="brand"><b>MY_<i>ToksiLab</i></b><span class="pill">KALİBRASYON MASASI</span></div><a href="https://spemrt.github.io/toksilab/lab_giris.html" id="hLab">‹ Laboratuvar</a></div>
 <div class="masa">
  <div class="kutu"><h3 id="zBas">Seyreltme zinciri · fentanil, metanolde</h3>
   <div class="zincir" id="zincir"></div></div>
  <div class="kutu" id="kBirim" hidden><h3>Birimler: her basamak 1000 kat</h3>
   <div class="birim"><div data-b="mg"><b>1</b><small>mg/mL</small></div><div data-b="ug"><b>1 000</b><small>µg/mL</small></div><div data-b="ng"><b>1 000 000</b><small>ng/mL</small></div><div data-b="pg"><b>10⁹</b><small>pg/mL</small></div></div></div>
  <div class="kutu" id="kFormul" hidden><h3>Tek formül</h3><div class="formul">C₁ × V₁ = C₂ × V₂<small>V₁ = C₂ × V₂ / C₁ · çözücü = V₂ − V₁ · iki tarafta birimler aynı</small></div></div>
  <div class="kutu" id="kPlan" hidden><h3>Hazırlama planı</h3><table id="plan"></table></div>
 </div>
</div>
<div id="dersK"><div id="P"></div></div>
<script>
const MEDIA=/github\.io$/.test(location.hostname)?'':'https://spemrt.github.io/toksilab/';const AVATAR=MEDIA+'avatar.jpg';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=n=>Number(n).toLocaleString('tr-TR',{maximumFractionDigits:3});
const num=v=>{v=String(v??'').trim().replace(/\s/g,'').replace(',','.');return v===''?NaN:Number(v)};
const near=(a,b,t=.01)=>isFinite(a)&&Math.abs(a-b)<=Math.max(Math.abs(b)*t,1e-9);
/* yanlış cevaba göre ipucu: 1000 kat fark birim, 10/100 kat fark yanlış stok */
function ipucu(v,dogru){if(!isFinite(v))return 'Bir sayı yaz.';const r=v/dogru;
 if(near(r,1000,.02)||near(r,.001,.02))return '1000 kat fark var: birimi kontrol et (mL ↔ µL ya da µg ↔ ng).';
 if(near(r,10,.02)||near(r,.1,.02)||near(r,100,.02)||near(r,.01,.02))return 'Kat farkı var: C₁ olarak doğru stoğun konsantrasyonunu mu kullandın?';
 return 'Olmadı. V₁ = C₂ × V₂ / C₁ ile yeniden hesapla; birimleri eşitlemeyi unutma.'}

/* birimli çözüm: V₁ = C₂ × V₂ / C₁; C birimleri sadeleşir, hacim birimi kalır */
const B=(c2,cu,v2,vu,c1,son)=>`V₁ = (${c2} <s>${cu}</s> × ${v2} <span class="kal">${vu}</span>) / ${c1} <s>${cu}</s> = <span class="kal">${son}</span>`;
/* zincir ve plan */
const Z=[{k:'ana',ad:'Ana stok',c:'1 mg/mL',a:'referans ampul'},{k:'as1',ad:'AS-1',c:'1000 ng/mL',a:'10 mL'},{k:'as2',ad:'AS-2',c:'10 ng/mL',a:'10 mL'},{k:'as3',ad:'AS-3',c:'1 ng/mL',a:'10 mL'},{k:'kal',ad:'Kalibratörler',c:'0,05–5 ng/mL',a:'7 seviye × 1 mL'}];
const PLAN=[['AS-1','1000 ng/mL','Ana stok (1 000 000 ng/mL)','10 µL'],['AS-2','10 ng/mL','AS-1 (1000 ng/mL)','100 µL'],['AS-3','1 ng/mL','AS-2 (10 ng/mL)','10 000 µL = 10 mL'],
 ['K7 · 5','5 ng/mL','AS-2','500 µL'],['K5 · 1','1 ng/mL','AS-2','100 µL'],['K3 · 0,25','0,25 ng/mL','AS-3','250 µL'],['K1 · 0,05','0,05 ng/mL','AS-3','50 µL']];
const ZE=[{k:'est',ad:'Etanol stok',c:'1 g/L',a:'suda'},{k:'ekal',ad:'Kalibratörler',c:'0,05–0,5 g/L',a:'HS viali · 2 mL · su ile'}];
const PLANE=[['E · 0,5','0,5 g/L','Etanol stok (1 g/L)','1000 µL + 1000 µL su'],['E · 0,1','0,1 g/L','Etanol stok (1 g/L)','200 µL + 1800 µL su'],['E · 0,05','0,05 g/L','Etanol stok (1 g/L)','100 µL + 1900 µL su']];
let TAM={},ON=null,PON=-1,ZC='f';
function zincirCiz(){const zz=ZC==='e'?ZE:Z;$('#zBas').textContent=ZC==='e'?'Seyreltme · etanol, suda (HS viali)':'Seyreltme zinciri · fentanil, metanolde';$('#zincir').innerHTML=zz.map((z,i)=>(i?'<span class="ok-ar">→</span>':'')+`<div class="halka${ON===z.k?' on':''}${TAM[z.k]?' tam':''}"><small>${z.ad.toUpperCase()}</small><b>${z.c}</b><span>${z.a}</span></div>`).join('')}
function planCiz(){const pl=ZC==='e'?PLANE:PLAN,pk=ZC==='e'?'e':'p';$('#plan').innerHTML='<tr><th>ÇÖZELTİ</th><th>HEDEF</th><th>NEREDEN</th><th>ALINACAK (V₁)</th></tr>'+pl.map((r,i)=>{const t=TAM[pk+i];return `<tr class="${i===PON?'on':''} ${t?'tam':''}"><td class="g">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="v ${t?'':'bos'}">${t?r[3]:'?'}</td></tr>`}).join('')}
function goster(o){$('#kBirim').hidden=!o.birim;$('#kFormul').hidden=!o.formul;$('#kPlan').hidden=!o.plan;$$('.birim div').forEach(d=>d.classList.toggle('on',(o.birimOn||[]).includes(d.dataset.b)));ON=o.on||null;PON=o.pon??-1;ZC=o.z||'f';zincirCiz();planCiz()}

/* adımlar: html = açıklama; s = soru {soru, birim, dogru, ac(açıklama doğru cevaptan sonra)}; g = sol taraf görünümü */
const ADIM=[
 {bolum:'Giriş',b:'Kalibrasyon neden gerekir?',g:{on:'kal'},html:'<p>Cihaz bize madde miktarını değil, bir <b>sinyal</b> (pik alanı) verir. Sinyali konsantrasyona çevirmek için, konsantrasyonunu bildiğimiz çözeltileri ölçeriz: bunlar <b>kalibratörlerdir</b>.</p><p>Bu derste fentanil için <b>0,05–5 ng/mL</b> arası 7 kalibratörü, <b>1 mg/mL</b>’lik ana stoktan metanolle seyrelterek hazırlamayı adım adım hesaplayacağız.</p><p>Soldaki <b>seyreltme zinciri</b> yol haritamız: ana stok → üç ara stok → kalibratörler.</p>'},
 {bolum:'Birimler',b:'Her basamak 1000 kat',g:{birim:1,birimOn:['mg','ug','ng'],on:'ana'},html:'<p>Konsantrasyon birimleri 1000’er kat ilerler:</p><div class="hes">1 mg/mL = 1 000 µg/mL = 1 000 000 ng/mL</div><p>Hesaplarda en sık hata buradan gelir: iki tarafta birimler aynı olmalı. Ana stoğumuzu <b>ng/mL</b>’ye çevirip çalışacağız.</p>'},
 {bolum:'Birimler',b:'Ana stok ng/mL olarak',g:{birim:1,birimOn:['mg','ng'],on:'ana'},s:{soru:'Ana stok <b>1 mg/mL</b>. Bu kaç <b>ng/mL</b> eder?',birim:'ng/mL',dogru:1e6,ac:'<p>1 mg = 1 000 µg = 1 000 000 ng. Yani ana stok <b>1 000 000 ng/mL</b>.</p>'}},
 {bolum:'Formül',b:'Tek formül: C₁V₁ = C₂V₂',g:{formul:1},html:'<p>Seyreltmede madde miktarı değişmez, yalnız hacim artar:</p><div class="hes">C₁ × V₁ = C₂ × V₂</div><ul><li><b>C₁</b>: elimdeki çözelti</li><li><b>V₁</b>: ondan alacağım hacim (aradığımız)</li><li><b>C₂</b>: istediğim konsantrasyon</li><li><b>V₂</b>: istediğim toplam hacim</li></ul><div class="hes">V₁ = C₂ × V₂ / C₁</div><p>Alınan hacim balon jojeye konur, <b>metanolle çizgiye tamamlanır</b>.</p>'},
 {bolum:'Formül',b:'Birimler nasıl sadeleşir?',g:{formul:1},html:'<p>Formülü birimleriyle yazınca hangi birimin kalacağı görünür. Üstte ve altta <b>aynı</b> olan birim birbirini götürür:</p><div class="hes">'+B('1000','ng/mL','10','mL','1 000 000','0,01 mL')+'</div><p><b>ng/mL</b> üstte de altta da var: sadeleşir (üstü çizili). Geriye <span style="color:#F2B632;font-weight:700">mL</span> kalır: sonuç bir <b>hacimdir</b>.</p><p>Bu yüzden iki konsantrasyon <b>aynı birimde</b> olmalı. Biri mg/mL, öbürü ng/mL ise sadeleşmez ve sonuç 1000 kat yanlış çıkar.</p>'},
 {bolum:'Formül',b:'Sonucun birimi',g:{formul:1},sec:{soru:'C₂ = 5 <b>ng/mL</b>, V₂ = 1000 <b>µL</b>, C₁ = 10 <b>ng/mL</b>. V₁ hangi birimde çıkar?',sik:['ng/mL','µL','ng'],dogru:1,ac:'<div class="hes">'+B('5','ng/mL','1000','µL','10','500 µL')+'</div><p>ng/mL sadeleşir, V₂’nin birimi <b>µL</b> kalır. V₂’yi µL yazarsan sonuç µL, mL yazarsan mL çıkar.</p>'}},
 {bolum:'Formül',b:'Neden ara stok?',g:{formul:1,on:'kal'},html:'<p>1 000 000 ng/mL’den 0,05 ng/mL’ye tek adımda inmek için 1 mL’lik kalibratöre <b>0,00005 µL</b> ana stok gerekirdi: hiçbir pipet bunu alamaz.</p><p>Bu yüzden 10 ya da 100 katlık adımlarla, <b>ara stoklarla</b> ineriz.</p><p><b>Pratik kural:</b> pipetle alınacak hacim <b>10 µL’den az olmamalı</b>. Azsa daha seyreltik ara stoktan al.</p>'},
 {bolum:'Ara stoklar',b:'AS-1: 1000 ng/mL',g:{formul:1,plan:1,on:'as1',pon:0},s:{soru:'<b>AS-1</b>: 10 mL balon jojede <b>1000 ng/mL</b>. Ana stoktan (1 000 000 ng/mL) kaç <b>µL</b> alırsın?',birim:'µL',dogru:10,yol:B('1000','ng/mL','10','mL','1 000 000','0,01 mL = 10 µL'),ac:'<p>0,01 mL = <b>10 µL</b> ana stok alınır, metanolle 10 mL’ye tamamlanır.</p>',tam:['as1','p0']}},
 {bolum:'Ara stoklar',b:'AS-2: 10 ng/mL',g:{formul:1,plan:1,on:'as2',pon:1},s:{soru:'<b>AS-2</b>: 10 mL, <b>10 ng/mL</b>. <b>AS-1</b>’den (1000 ng/mL) kaç <b>µL</b>?',birim:'µL',dogru:100,yol:B('10','ng/mL','10','mL','1000','0,1 mL = 100 µL'),ac:'<p>0,1 mL = <b>100 µL</b> AS-1 alınır, metanolle 10 mL’ye tamamlanır. 100 kat seyreltme.</p>',tam:['as2','p1']}},
 {bolum:'Ara stoklar',b:'AS-3: 1 ng/mL',g:{formul:1,plan:1,on:'as3',pon:2},s:{soru:'<b>AS-3</b>: 10 mL, <b>1 ng/mL</b>. <b>AS-2</b>’den (10 ng/mL) kaç <b>mL</b>?',birim:'mL',dogru:1,yol:B('1','ng/mL','10','mL','10','1 mL'),ac:'<p><b>1 mL</b> AS-2 alınır, metanolle 10 mL’ye tamamlanır. 10 kat seyreltme.</p>',tam:['as3','p2']}},
 {bolum:'Kalibratörler',b:'Hangi stoktan?',g:{plan:1,on:'kal'},html:'<p>Her kalibratör <b>1 mL</b> (1000 µL) hazırlanır.</p><ul><li>Üst seviyeler (<b>1–5 ng/mL</b>) → <b>AS-2</b>’den (10 ng/mL)</li><li>Alt seviyeler (<b>0,05–0,5 ng/mL</b>) → <b>AS-3</b>’ten (1 ng/mL)</li></ul><p>Böylece bütün hacimler <b>50–500 µL</b> arasında kalır: pipetle rahat ve doğru alınır.</p>'},
 {bolum:'Kalibratörler',b:'En üst seviye: 5 ng/mL',g:{formul:1,plan:1,on:'kal',pon:3},s:{soru:'<b>5 ng/mL</b>, toplam 1000 µL, <b>AS-2</b>’den (10 ng/mL). Kaç <b>µL</b> AS-2?',birim:'µL',dogru:500,yol:B('5','ng/mL','1000','µL','10','500 µL'),ac:'<p><b>500 µL</b> AS-2 + <b>500 µL</b> metanol.</p>',tam:['p3']}},
 {bolum:'Kalibratörler',b:'1 ng/mL',g:{formul:1,plan:1,on:'kal',pon:4},s:{soru:'<b>1 ng/mL</b>, 1000 µL, <b>AS-2</b>’den (10 ng/mL). Kaç <b>µL</b>?',birim:'µL',dogru:100,yol:B('1','ng/mL','1000','µL','10','100 µL'),ac:'<p><b>100 µL</b> AS-2 + <b>900 µL</b> metanol.</p>',tam:['p4']}},
 {bolum:'Kalibratörler',b:'0,25 ng/mL',g:{formul:1,plan:1,on:'kal',pon:5},s:{soru:'<b>0,25 ng/mL</b>, 1000 µL. Artık <b>AS-3</b>’ten (1 ng/mL). Kaç <b>µL</b>?',birim:'µL',dogru:250,yol:B('0,25','ng/mL','1000','µL','1','250 µL'),ac:'<p><b>250 µL</b> AS-3 + <b>750 µL</b> metanol. AS-2’den alsaydık 25 µL gerekirdi; AS-3 daha rahat.</p>',tam:['p5']}},
 {bolum:'Kalibratörler',b:'En alt seviye: 0,05 ng/mL',g:{formul:1,plan:1,on:'kal',pon:6},s:{soru:'<b>0,05 ng/mL</b>, 1000 µL, <b>AS-3</b>’ten (1 ng/mL). Kaç <b>µL</b>?',birim:'µL',dogru:50,yol:B('0,05','ng/mL','1000','µL','1','50 µL'),ac:'<p><b>50 µL</b> AS-3 + <b>950 µL</b> metanol. Plan tamam!</p>',tam:['p6','kal']}},
 {bolum:'Etanol',b:'İkinci örnek: kanda etanol',g:{z:'e',plan:1,on:'est'},html:'<p>Etanol kalibratörleri farklı hazırlanır:</p><ul><li>Birim <b>g/L</b> (kanda alkol böyle raporlanır). 1 g/L = 1 mg/mL.</li><li>Aralık <b>0,05–0,5 g/L</b>, her kalibratör doğrudan <b>HS viali</b>nde, son hacim <b>2 mL</b>.</li><li>Seyreltme <b>su</b> ile yapılır, metanolle değil.</li></ul><p>Elimizde <b>1 g/L</b>’lik etanol stoğu (suda) var. Formül aynı: V₁ = C₂ × V₂ / C₁.</p>'},
 {bolum:'Etanol',b:'Neden su?',g:{z:'e',plan:1,on:'est'},sec:{soru:'Etanol standardını hangisiyle seyreltiriz?',sik:['Metanol','Su'],dogru:1,ac:'<p><b>Su.</b> Metanol de uçucu bir alkoldür: HS-GC’de etanole yakın bir pik verir, etanol ölçümüne karışır. Kan da sulu bir matrikstir; kalibratörler de suda hazırlanınca numuneye benzer.</p><p>Fentanil gibi ilaçlarda ise metanol kullanılır: madde metanolde iyi çözünür ve LC-MS/MS için uygundur.</p>'}},
 {bolum:'Etanol',b:'0,5 g/L',g:{z:'e',formul:1,plan:1,on:'ekal',pon:0},s:{soru:'<b>0,5 g/L</b>, HS vialinde son hacim <b>2 mL</b> (2000 µL), stok <b>1 g/L</b>. Kaç <b>µL</b> stok?',birim:'µL',dogru:1000,yol:B('0,5','g/L','2000','µL','1','1000 µL'),ac:'<p><b>1000 µL</b> stok + <b>1000 µL</b> su.</p>',tam:['e0']}},
 {bolum:'Etanol',b:'0,1 g/L',g:{z:'e',formul:1,plan:1,on:'ekal',pon:1},s:{soru:'<b>0,1 g/L</b>, son hacim 2000 µL, stok 1 g/L. Kaç <b>µL</b> stok?',birim:'µL',dogru:200,yol:B('0,1','g/L','2000','µL','1','200 µL'),ac:'<p><b>200 µL</b> stok + <b>1800 µL</b> su.</p>',tam:['e1']}},
 {bolum:'Etanol',b:'0,05 g/L',g:{z:'e',formul:1,plan:1,on:'ekal',pon:2},s:{soru:'<b>0,05 g/L</b>, son hacim 2000 µL, stok 1 g/L. Kaç <b>µL</b> stok?',birim:'µL',dogru:100,yol:B('0,05','g/L','2000','µL','1','100 µL'),ac:'<p><b>100 µL</b> stok + <b>1900 µL</b> su. Etanol kalibratörleri tamam!</p>',tam:['e2','ekal']}},
 {bolum:'Kontrol',test:1}];
const SORU=[
 ['V₁ = (2 ng/mL × 1 mL) / (10 ng/mL) hesabında sonuç hangi birimde?',['ng/mL','mL','ng'],1,'ng/mL sadeleşir; V₂’nin birimi mL kalır: 0,2 mL.'],
 ['0,5 µg/mL kaç ng/mL?',['0,5','500','500 000'],1,'µg → ng 1000 kat: 0,5 × 1000 = 500 ng/mL.'],
 ['Alınacak hacim 3 µL çıktı. Ne yaparsın?',['3 µL alırım','Daha seyreltik bir ara stoktan alırım','Hacmi tahmin ederim'],1,'10 µL’nin altı pipetle doğru alınamaz; daha seyreltik stok kullanılır.'],
 ['2 ng/mL, 1000 µL kalibratör için AS-2’den (10 ng/mL) kaç µL?',['20 µL','200 µL','2000 µL'],1,'2 × 1000 / 10 = 200 µL; kalan 800 µL metanol.']];
const bolumler=[...new Set(ADIM.map(a=>a.bolum))];
let i=0,gecti=false,uyari='',sn=0,cevap=null,puan=0;
const P=$('#P');
function ciz(){const a=ADIM[i],bi=bolumler.indexOf(a.bolum);
 let h=`<div class="ust"><b>KALİBRASYON ÇÖZELTİSİ</b><span>${i+1} / ${ADIM.length}</span></div><div class="bol">${bolumler.map((b,k)=>`<i class="${k<bi?'g':k===bi?'s':''}">${b}</i>`).join('')}</div>`;
 if(a.test)h+=test();
 else{
  if(a.sec){h+=`<div class="ask${gecti?' tamam':''}">${gecti?'✓ Doğru!':a.sec.soru}${uyari?'<small>'+uyari+'</small>':''}</div>`;
   h+=gecti?`<div class="kart"><h4>${a.b}</h4>${a.sec.ac}</div>`:`<div class="sec">${a.sec.sik.map((c,k)=>`<button data-sk="${k}">${c}</button>`).join('')}</div>`}
  else if(a.s){h+=`<div class="ask${gecti?' tamam':''}">${gecti?'✓ Doğru! Açıklamayı oku, sonra devam et.':a.s.soru}${uyari?'<small>'+uyari+'</small>':''}</div>`;
   if(!gecti)h+=`<div class="giris"><input id="cvp" inputmode="decimal" autocomplete="off" placeholder="cevap"><span class="u">${a.s.birim}</span></div><div class="hsat"><label>🧮 HESAP SATIRI · formülü yaz: 0,5 × 2000 / 1</label><div class="sat"><input id="hs" autocomplete="off" placeholder="ör. 1000 × 10 / 1000000"><output id="hso">—</output><button id="hsa" title="Sonucu cevap kutusuna yaz">↓</button></div></div><div class="alt"><button class="k" id="kontrol">✓ Kontrol et</button><button class="ince" id="goster">Çözümü göster</button></div>`;
   else h+=`<div class="kart"><h4>${a.b}</h4>${a.s.yol?'<div class="hes">'+a.s.yol+'</div>':''}${a.s.ac}</div>`}
  else h+=`<div class="kart"><h4>${a.b}</h4>${a.html}</div>`;
  h+=`<div class="alt"><button id="geri" ${i?'':'disabled'}>‹ Geri</button><button class="p" id="ileri" ${(a.s||a.sec)&&!gecti?'disabled':''}>Devam ›</button></div>`}
 h+=`<div class="mentor"><img src="${AVATAR}" alt=""><div><div class="nm">UZM. MY</div><p id="say">${soz()}</p></div></div>`;
 P.innerHTML=h;goster(a.g||{plan:1});
 const c=$('#cvp');if(c){c.focus();c.onkeydown=e=>{if(e.key==='Enter')kontrol()}}
 const k=$('#kontrol');if(k)k.onclick=kontrol;
 P.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{if(+b.dataset.sk===a.sec.dogru){uyari='';gecti=true;TAM['sec'+i]=1;ciz()}else{uyari='Bir daha düşün: '+(a.sec.ipucu||'açıklamayı hatırla.');ciz()}});
 const hs=$('#hs');if(hs){const hsH=()=>{const r=hesapla(hs.value);$('#hso').textContent=isFinite(r)?fmt(r):'—'};hs.oninput=hsH;hs.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#hsa').click()}};$('#hsa').onclick=()=>{const r=hesapla(hs.value);if(isFinite(r)){c.value=String(+r.toPrecision(10)).replace('.',',');c.focus()}}}const g=$('#goster');if(g)g.onclick=()=>{uyari='';tamam()};
 const gr=$('#geri');if(gr)gr.onclick=()=>git(i-1);const il=$('#ileri');if(il)il.onclick=()=>git(i+1);
 P.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(cevap!==null)return;cevap=+b.dataset.c;if(cevap===SORU[sn][2])puan++;ciz()});
 const sd=$('#dSoru');if(sd)sd.onclick=()=>{sn++;cevap=null;ciz()};const bt=$('#bastan');if(bt)bt.onclick=()=>{TAM={};sn=0;puan=0;cevap=null;git(0)}}
function soz(){const a=ADIM[i];if(a.test)return sn>=SORU.length?'Tebrikler! Kalibratör planını baştan sona çıkardın.':'Son olarak üç kısa soru.';
 if(uyari)return 'Hata yapmak öğrenmenin parçası. İpucuna bakıp bir daha dene.';if(a.s&&!gecti)return 'Formülü aşağıdaki <b>hesap satırına</b> yazabilirsin; birimleri sadeleştirmeyi unutma.';if(gecti)return 'Harika! Plan tablosu doldu, bak.';return 'Hazırsan <b>Devam</b>’a bas.'}
function hesapla(t){t=String(t||'').replace(/×|x/gi,'*').replace(/÷|:/g,'/').replace(/\s/g,'').replace(/(\d),(\d)/g,'$1.$2');if(!t||!/^[\d.+\-*/()]+$/.test(t))return NaN;try{const r=Function('"use strict";return ('+t+')')();return typeof r==='number'?r:NaN}catch(e){return NaN}}
function kontrol(){const a=ADIM[i],v=num($('#cvp').value);if(near(v,a.s.dogru)){uyari='';tamam()}else{uyari=ipucu(v,a.s.dogru);ciz()}}
function tamam(){const a=ADIM[i];gecti=true;(a.s.tam||[]).forEach(k=>TAM[k]=1);ciz()}
function git(n){if(n<0||n>=ADIM.length)return;i=n;gecti=!!TAM['sec'+n]||!!(ADIM[i].s&&(ADIM[i].s.tam||[]).every(k=>TAM[k])&&(ADIM[i].s.tam||[]).length);uyari='';ciz();
 if(matchMedia('(max-width:900px)').matches)$('#dersK').scrollTop=0}
function test(){if(sn>=SORU.length)return `<div class="kart"><h4>Bölüm tamamlandı</h4><div class="hes">${puan} / ${SORU.length} doğru</div><p>Ana stoktan ara stoklarla kalibratörlere inmeyi, birimlerin nasıl sadeleştiğini ve etanol kalibratörlerinin suda hazırlandığını öğrendin.</p>${puan<SORU.length?'<p>Yanlış yanıtladığın konular için ilgili adımlara geri dönebilirsin.</p>':''}</div><div class="alt"><button id="bastan">↺ Baştan</button><button class="p" onclick="location.href=MEDIA+'index.html#menu'">Eğitimlere dön ›</button></div>`;
 const s=SORU[sn];return `<div class="kart"><h4>Soru ${sn+1} / ${SORU.length}</h4><div>${s[0]}</div><div class="sec">${s[1].map((c,k)=>`<button data-c="${k}" class="${cevap===null?'':k===s[2]?'d':k===cevap?'y':''}">${c}</button>`).join('')}</div>${cevap!==null?'<div style="font-size:13.5px;color:#B9CBD0">'+(cevap===s[2]?'✓ Doğru. ':'✗ Doğru yanıt işaretlendi. ')+s[3]+'</div>':''}</div>${cevap!==null?`<div class="alt"><button class="p" id="dSoru">${sn+1<SORU.length?'Sonraki soru ›':'Sonucu gör ›'}</button></div>`:''}`}
$('#hLab').onclick=e=>{e.preventDefault();const r=new URLSearchParams(location.search).get('ret');location.href=MEDIA+'lab_giris.html'+(r?'#'+r:'')};
git(0);
</script>
