<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>ToksiLab Adli Vakalar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: tek sütun "vaka dosyası" — üstte delil etiketi, adım rayı, altta enstrüman ekranı gibi çalışan sahne */
:root{
  --bg:#E9EEEC; --surface:#FFFFFF; --sunk:#DCE4E1; --ink:#14201D; --muted:#566661; --line:#C3CFCB;
  --accent:#0E6F66; --accent-ink:#FFFFFF; --tag:#F2C230; --tag-ink:#2A2100;
  --ok:#1C7C3A; --ok-bg:#DDF2E3; --bad:#B42318; --bad-bg:#FBE3E0; --warn:#A15C00; --warn-bg:#FCEFD6;
  --scope-bg:#0F1A18; --scope-grid:#22332F; --scope-ink:#B9CCC6; --trace:#3FE0C5; --qual:#FF9F43;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1312; --surface:#141F1D; --sunk:#1B2826; --ink:#E3ECE9; --muted:#8FA39D; --line:#2A3B37;
  --accent:#34CDB8; --accent-ink:#04201C; --tag:#F2C230; --tag-ink:#2A2100;
  --ok:#5BD483; --ok-bg:#12301E; --bad:#FF8A7A; --bad-bg:#3A1612; --warn:#F2B04A; --warn-bg:#33240C;
  --scope-bg:#070D0C; --scope-grid:#1A2A27; --scope-ink:#9FB6AF; --trace:#3FE0C5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1312; --surface:#141F1D; --sunk:#1B2826; --ink:#E3ECE9; --muted:#8FA39D; --line:#2A3B37;
  --accent:#34CDB8; --accent-ink:#04201C; --tag:#F2C230; --tag-ink:#2A2100;
  --ok:#5BD483; --ok-bg:#12301E; --bad:#FF8A7A; --bad-bg:#3A1612; --warn:#F2B04A; --warn-bg:#33240C;
  --scope-bg:#070D0C; --scope-grid:#1A2A27; --scope-ink:#9FB6AF; --trace:#3FE0C5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Home */
.hero{display:flex;flex-direction:column;gap:12px;padding-block:8px 4px}
.hero h1{font-size:clamp(44px,12vw,76px);font-weight:800;letter-spacing:-.03em}
.hero h1 span{color:var(--accent)}
.hero p{max-width:56ch;color:var(--muted);font-size:17px}
.flow{display:flex;flex-wrap:wrap;gap:6px}
.flow span{font-family:var(--f-mono);font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.cases{display:grid;gap:14px}
.casecard{display:grid;grid-template-columns:auto 1fr;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;transition:transform .15s,border-color .15s}
.casecard:hover{transform:translateY(-2px);border-color:var(--accent)}
.tagstub{width:58px;background:var(--tag);color:var(--tag-ink);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 4px;position:relative}
.tagstub::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.tagstub b{font-family:var(--f-display);font-size:26px;line-height:1}
.barcode{width:38px;height:16px;background:repeating-linear-gradient(90deg,var(--tag-ink) 0 1px,transparent 1px 3px,var(--tag-ink) 3px 5px,transparent 5px 6px)}
.casecard h3{font-size:21px;margin-block:2px 6px}
.casecard p{color:var(--muted);font-size:15px}
.casecard .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.best{background:var(--ok-bg);color:var(--ok)}
.foot{color:var(--muted);font-size:13px;max-width:60ch}

/* Case view */
.casebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
.caseid{font-family:var(--f-mono);font-size:13px;background:var(--tag);color:var(--tag-ink);padding:4px 8px;border-radius:4px;font-weight:600}
.scorebox{margin-left:auto;font-family:var(--f-mono);font-size:14px}
.scorebox b{font-size:20px;color:var(--accent)}
.rail{list-style:none;margin:0;padding:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.rail li{flex:1 0 auto;min-width:64px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:8px;border-top:3px solid var(--line)}
.rail li.done{border-color:var(--accent);color:var(--ink)}
.rail li.now{border-color:var(--tag);color:var(--ink);font-weight:600}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.stage h2{font-size:26px}
.story{font-size:17px;max-width:62ch}
.evidence{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ev{border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.ev i{flex:none;width:10px;height:26px;border-radius:3px;margin-top:2px}
.q{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.25}
.note{color:var(--muted);font-size:15px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;transition:border-color .15s,background .15s}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .key{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:600;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .key{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.fb{border-radius:8px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.fb.good{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.fb.part{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn)}
.fb.poor{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.fb strong{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.btn{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:12px 18px;font-weight:700;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}

/* Analyzer */
.analyzer{background:var(--scope-bg);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--scope-ink)}
.an-head{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.an-row{display:grid;grid-template-columns:48px 1fr 92px;gap:10px;align-items:center;font-family:var(--f-mono);font-size:13px}
.an-bar{position:relative;height:12px;background:var(--scope-grid);border-radius:3px;overflow:hidden}
.an-bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--trace);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.an-bar i.pos{background:var(--tag)}
.an-bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--scope-ink);opacity:.7}
.an-val{text-align:right;font-variant-numeric:tabular-nums}
.an-val .p{color:var(--tag);font-weight:600}
.an-legend{font-size:11px;font-family:var(--f-mono);opacity:.8}

/* Chromatogram */
.scope{background:var(--scope-bg);border-radius:10px;padding:10px 6px 4px;overflow-x:auto}
.scope svg{display:block;width:100%;min-width:340px;height:auto}
.scope text{font-family:var(--f-mono);font-size:11px;fill:var(--scope-ink)}
.criteria{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.crit{background:var(--sunk);border-radius:8px;padding:10px;font-size:13.5px}
.crit b{display:block;font-family:var(--f-mono);font-size:15px;color:var(--accent)}
.peaks{display:grid;gap:10px}
.peak{border:1.5px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.peak.hl{border-color:var(--tag)}
.peak.ok{border-color:var(--ok)} .peak.no{border-color:var(--bad)}
.peak-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pn{width:26px;height:26px;border-radius:50%;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;flex:none}
.peak-top h3{font-size:18px}
.mrm{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pdata{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pdata div{background:var(--bg);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--muted)}
.pdata b{display:block;font-family:var(--f-mono);font-size:13.5px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.pdata .x b{color:var(--bad)} .pdata .v b{color:var(--ok)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.seg button{background:none;border:none;padding:8px 14px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"].y{background:var(--ok);color:var(--surface)}
.seg button[aria-pressed="true"].n{background:var(--bad);color:var(--surface)}
.seg button:disabled{cursor:default}
.verdict{font-size:14px}

/* Calibration */
.calib{display:grid;gap:14px}
.calplot{background:var(--sunk);border-radius:10px;padding:8px}
.calplot svg{display:block;width:100%;height:auto}
.calplot text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.eq div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.eq b{display:block;font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums}
.answer{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.answer input{font-family:var(--f-mono);font-size:18px;width:140px;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.answer span{font-family:var(--f-mono);color:var(--muted)}

/* Final */
.final-score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--accent)}
.rank{display:inline-block;background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:600;padding:5px 10px;border-radius:4px;font-size:13px}
.logt{width:100%;border-collapse:collapse;font-size:14px}
.logt td{padding:8px 4px;border-bottom:1px solid var(--line)}
.logt td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* Pik Okulu */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.sec-head h2{font-size:26px}
.lessons{display:grid;gap:8px}
.lesson{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.lesson:hover{border-color:var(--accent)}
.lesson .ln{width:34px;height:34px;border-radius:8px;background:var(--scope-bg);color:var(--trace);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600}
.lesson b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.2}
.lesson small{color:var(--muted);font-size:13.5px}
.lesson .ck{font-family:var(--f-mono);font-size:12px;color:var(--ok)}
.theory{display:flex;flex-direction:column;gap:10px;max-width:64ch}
.rule{border-left:4px solid var(--tag);background:var(--sunk);padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px}
.rule b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;color:var(--muted)}
.xic{background:var(--scope-bg);border-radius:10px;padding:8px 4px 2px}
.xic svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.xic text{font-family:var(--f-mono);font-size:11px;fill:var(--scope-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.ctrls{display:grid;gap:10px}
.sl{display:grid;grid-template-columns:76px 1fr 62px;gap:10px;align-items:center;font-size:14px}
.sl input{width:100%;accent-color:var(--accent)}
.sl output{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.tg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.readout div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted);min-width:0}
.readout b{display:block;font-family:var(--f-mono);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.task{border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.task.met{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.task .st{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.task.met .st{color:var(--ok)}
.seq{display:grid;gap:6px}
.seqrow{display:grid;grid-template-columns:22px minmax(0,1.4fr) minmax(50px,1fr) 52px auto;gap:8px;align-items:center;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.seqrow.on{border-color:var(--tag)}
.seqrow .sn{min-width:0;overflow-wrap:anywhere}
.seqrow .sv{text-align:right;font-variant-numeric:tabular-nums}
.seqrow .bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.seqrow .bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:480px){.seqrow{grid-template-columns:20px minmax(0,1fr) 52px;}.seqrow .bar{grid-column:2/4}.seqrow>span:last-child{grid-column:2/4}}
.labentry{display:grid;grid-template-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.labentry-art svg{display:block;width:100%;height:auto}
.labentry-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.labentry-body h2{font-size:28px}
.labentry-body p{color:var(--muted);max-width:60ch}
@media (min-width:640px){.labentry{grid-template-columns:1.1fr 1fr}.labentry-art{display:flex;align-items:center;background:#E7EEF1}}
.labcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.labcard h3{font-size:20px}
.stations{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.stn{flex:1 0 auto;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:700}
.stn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stn.go{border-color:var(--tag);animation:pulse 1.4s infinite}
.scene{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#E7EEF1}
.scene svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.scene .sl{font-family:var(--f-mono);font-size:9px;fill:#2B3E44}
.scene .bl{font-family:var(--f-mono);font-size:6.5px;fill:#2B3E44}
.scene .it{cursor:pointer;outline:none}
.scene .it .halo{fill:none;stroke:#F2C230;stroke-width:3;opacity:0}
.scene .it:hover .halo,.scene .it:focus-visible .halo{opacity:.6}
.scene .it.tgt .halo{animation:halo 1.3s ease-in-out infinite}
.scene .an-vortex,.scene .an-etube{animation:shake .12s linear 8;transform-box:fill-box;transform-origin:center}
.scene .an-centri .rotor{animation:spin .25s linear 5;transform-box:fill-box;transform-origin:center}
.scene .drip{opacity:0}
.scene .an-manifold .drip,.scene .an-stube~g .drip{animation:drip .5s ease-in 3}
.scene .an-evap line{animation:shake .2s linear 5}
@keyframes halo{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,194,48,.0)}50%{box-shadow:0 0 0 4px rgba(242,194,48,.45)}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}100%{transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drip{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(22px)}}
.labdlg{background:var(--surface);border:1.5px solid var(--tag);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.stage{padding:16px}.pdata{grid-template-columns:1fr 1fr}.an-row{grid-template-columns:42px 1fr 80px}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const CASES=[
{id:"TX-26-0417",title:"Pansiyon odası",short:"Yatağın yanında folyo ve enjektör. Opiat mı, sentetik opioid mi?",level:"Başlangıç",
steps:[
{type:"brief",tag:"Dosya",story:"34 yaşında erkek, kiralık bir odada yatağın yanında ölü bulundu. Odada yanık folyo parçaları, çakmak ve kullanılmış bir enjektör var. Otopside akciğer ödemi ve köpüklü sekresyon görüldü. Otopsi, ölümden yaklaşık 18 saat sonra yapıldı.",
 ev:[["Femoral kan","gri kapak, NaF","#8A9590"],["Kalp kanı","gri kapak","#8A9590"],["İdrar","25 mL","#E6C34A"],["Vitreus humor","1,8 mL","#9BC6D9"]]},

const RT_TOL=.10, IR_TOL=.20, SN_MIN=3;
const app=document.getElementById('app');
let S={c:0,i:0,score:0,log:[]};
const fmt=(n,d=2)=>n.toFixed(d).replace('.',',');
function loadBest(){try{return JSON.parse(localStorage.getItem('toksilab-best')||'{}')}catch(e){return {}}}
function saveBest(id,pct){try{const b=loadBest();if(!(b[id]>=pct)){b[id]=pct;localStorage.setItem('toksilab-best',JSON.stringify(b))}}catch(e){}}
function stepMax(s){if(s.type==='choice'||s.type==='immuno')return Math.max(...s.opts.map(o=>o.p));if(s.type==='chrom')return s.peaks.length*10;if(s.type==='calib')return 20;return 0}
function caseMax(c){return c.steps.reduce((a,s)=>a+stepMax(s),0)}
function isPos(p){return Math.abs(p.rt-p.ert)<=RT_TOL&&Math.abs(p.r-p.er)/p.er<=IR_TOL&&p.sn>=SN_MIN}

function home(){
  const best=loadBest();
  app.innerHTML=`<header class="hero">
    <span class="label">Adli toksikoloji simülatörü</span>
    <h1>Toksi<span>Lab</span></h1>
    <p>Önce Pik Okulu'nda LC-MS/MS integrasyonunu ve madde tanımlamayı elinle dene: pik sınırları, kuyruklanma, taban, girişim, iyon oranı ve S/N. Sonra öğrendiklerini gerçek iş akışıyla vakalarda kullan.</p>
  </header>
  <div class="labentry"><div class="labentry-art"><svg viewBox="0 0 400 150" aria-hidden="true">${labHeroArt()}</svg></div>
   <div class="labentry-body"><span class="label">Örnek hazırlama laboratuvarı</span><h2>Laboratuvara gir</h2><p>Önlüğünü giy, numuneyi teslim al ve morfin için MCX SPE ekstraksiyonunu tezgah tezgah kendin yap. Her seçimin sonucu en sonda kendi kromatogramında görünür.</p>
   <div class="row"><button class="btn" id="lg">Rehberli başla</button><button class="btn ghost" id="le">Sınav modu</button></div></div></div>
  <div class="sec-head"><h2>Pik Okulu</h2><span class="label">${LESSONS.length} ders · sürükle, entegre et, karar ver</span></div>
  <div class="lessons">${LESSONS.map((l,k)=>`<button class="lesson" data-l="${k}"><span class="ln">${k+1}</span><span><b>${l.title}</b><small>${l.analyte} · ${l.tag}</small></span><span class="ck">${K.done[k]?'✓ '+K.done[k]:''}</span></button>`).join('')}</div>
  <div class="sec-head"><h2>Vakalar</h2><span class="label">Numune → tarama → hazırlık → LC-MS/MS → rapor</span></div>
  <div class="cases">${CASES.map((c,k)=>`<button class="casecard" data-k="${k}">
    <div class="tagstub"><b>${k+1}</b><div class="barcode"></div></div>
    <div><span class="label">${c.id}</span><h3>${c.title}</h3><p>${c.short}</p>
    <div class="meta"><span class="pill">${c.level}</span><span class="pill">${caseMax(c)} puan</span>${best[c.id]!=null?`<span class="pill best">En iyi: %${best[c.id]}</span>`:''}</div></div>
  </button>`).join('')}</div>
  <p class="foot">Vakalar kurgusaldır ve eğitim amaçlıdır. Tanımlama kriterleri (RT ±0,10 dk, iyon oranı ±%20, S/N ≥ 3) bu simülasyon için seçilmiştir; kendi laboratuvarınızın valide yöntem kriterleri geçerlidir.</p>`;
  app.querySelectorAll('.casecard').forEach(b=>b.onclick=()=>start(+b.dataset.k));
  app.querySelectorAll('.lesson').forEach(b=>b.onclick=()=>lesson(+b.dataset.l));
  document.getElementById('lg').onclick=()=>labStart('guide');document.getElementById('le').onclick=()=>labStart('exam');
  window.scrollTo(0,0);
}
function start(k){S={c:k,i:0,score:0,log:[]};render()}
function award(tag,p,max){S.score+=p;S.log.push({tag,p,max});const sb=document.getElementById('sc');if(sb)sb.textContent=S.score}

function render(){
  const c=CASES[S.c],s=c.steps[S.i];
  app.innerHTML=`<div class="casebar"><button class="back" id="back">← Vakalar</button><span class="caseid">${c.id}</span><span class="mono" style="font-size:14px">${c.title}</span>
   <span class="scorebox">Puan <b id="sc">${S.score}</b> / ${caseMax(c)}</span></div>
   <ol class="rail">${c.steps.map((x,k)=>`<li class="${k<S.i?'done':k===S.i?'now':''}">${x.tag}</li>`).join('')}</ol>
   <section class="stage" id="stage"></section>`;
  document.getElementById('back').onclick=home;
  const st=document.getElementById('stage');
  ({brief,choice,immuno,chrom,calib})[s.type](s,st);
  window.scrollTo(0,0);
}
function next(){const c=CASES[S.c];if(S.i<c.steps.length-1){S.i++;render()}else final()}
function nextBtn(root,label){const b=document.createElement('button');b.className='btn';b.textContent=label||(S.i<CASES[S.c].steps.length-1?'Sonraki adım →':'Vakayı kapat →');b.onclick=next;root.appendChild(b);b.focus({preventScroll:true});b.scrollIntoView({behavior:'smooth',block:'nearest'})}

function brief(s,st){
  st.innerHTML=`<span class="label">Vaka dosyası</span><h2>${CASES[S.c].title}</h2><p class="story">${s.story}</p>
  <div><span class="label">Teslim alınan numuneler</span></div>
  <div class="evidence">${s.ev.map(e=>`<div class="ev"><i style="background:${e[2]}"></i><div><b>${e[0]}</b><br><span class="mono" style="font-size:12px;color:var(--muted)">${e[1]}</span></div></div>`).join('')}</div>`;
  nextBtn(st,'Numuneleri teslim al →');
}
function choiceBlock(s,root){
  const box=document.createElement('div');box.style.cssText='display:flex;flex-direction:column;gap:14px';
  box.innerHTML=`<p class="q">${s.q}</p><div class="opts">${s.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${'ABCD'[k]}</span><span>${o.t}</span></button>`).join('')}</div>`;
  root.appendChild(box);
  const best=Math.max(...s.opts.map(o=>o.p));
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const o=s.opts[+b.dataset.k];
    box.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(s.opts[k].p===best)x.classList.add('right')});
    if(o.p!==best)b.classList.add('wrong');
    award(s.tag,o.p,best);
    const fb=document.createElement('div');
    fb.className='fb '+(o.p===best?'good':o.p>=best/2?'part':'poor');
    fb.innerHTML=`<strong>+${o.p} puan · ${o.p===best?'Doğru':o.p>0?'Kısmen':'Hatalı'}</strong><span>${o.f}</span>${o.p!==best?`<span><b>En iyi seçim:</b> ${s.opts.find(x=>x.p===best).f}</span>`:''}`;
    box.appendChild(fb);nextBtn(root);
  });
}
function choice(s,st){st.innerHTML=`<span class="label">${s.tag}</span>`;choiceBlock(s,st)}

function immuno(s,st){
  st.innerHTML=`<span class="label">${s.tag}</span><h2>Ön tarama analizörü</h2>
  <div class="analyzer"><div class="an-head"><span>${s.matrix}</span><span id="anst">Hazır</span></div>
  ${s.panel.map(p=>`<div class="an-row"><span>${p[0]}</span><div class="an-bar"><i data-w="${Math.min(p[2]/p[1]/2,1)*100}" class="${p[2]>=p[1]?'pos':''}"></i></div><span class="an-val" data-v="${p[2]>=p[1]?`<span class='p'>${p[2]>=2000?'>2000':p[2]} POZ</span>`:`${p[2]} neg`}">—</span></div>`).join('')}
  <div class="an-legend">Çizgi = cut-off. Değerler ng/mL eşdeğeri. Cut-off: ${s.panel.map(p=>p[0]+' '+p[1]).join(' · ')}</div></div>`;
  const run=document.createElement('button');run.className='btn';run.textContent='Paneli çalıştır';st.appendChild(run);
  run.onclick=()=>{run.remove();document.getElementById('anst').textContent='Ölçülüyor…';
    st.querySelectorAll('.an-bar i').forEach(i=>i.style.width=i.dataset.w+'%');
    setTimeout(()=>{document.getElementById('anst').textContent='Tamamlandı';st.querySelectorAll('.an-val').forEach(v=>v.innerHTML=v.dataset.v);choiceBlock(s,st)},1200)};
}

function chrom(s,st){
  const W=640,H=230,L=34,R=628,T=24,B=196,xm=s.xmax;
  const X=x=>L+(x/xm)*(R-L),Y=y=>B-y*(B-T);
  let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  let d='';for(let x=0;x<=xm;x+=.01){let y=.012+rnd()*.012;s.peaks.forEach(p=>{const sg=.035;y+=p.h*Math.exp(-((x-p.rt)**2)/(2*sg*sg))});d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(Math.min(y,1)).toFixed(1)}
  let grid='';for(let t=0;t<=xm;t+=1){grid+=`<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${B}" stroke="var(--scope-grid)"/><text x="${X(t)}" y="${B+16}" text-anchor="middle">${t}</text>`}
  for(let k=0;k<=4;k++){const y=T+k*(B-T)/4;grid+=`<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" stroke="var(--scope-grid)"/>`}
  const marks=s.peaks.map((p,k)=>`<g class="pm" data-k="${k}" style="cursor:pointer"><circle cx="${X(p.rt)}" cy="${Math.max(Y(p.h+.03)-10,T+2)}" r="10" fill="var(--tag)"/><text x="${X(p.rt)}" y="${Math.max(Y(p.h+.03)-10,T+2)+4}" text-anchor="middle" style="fill:var(--tag-ink);font-weight:600">${k+1}</text></g>`).join('');
  st.innerHTML=`<span class="label">${s.tag}</span><h2>Pikleri değerlendir</h2>
  <p class="note">Her aday pik için kabul kriterlerini kontrol et ve <b>Pozitif</b> ya da <b>Negatif</b> olarak işaretle. Numaralı işaretlere dokunarak ilgili piki bulabilirsin.</p>
  <div class="scope"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Toplam MRM kromatogramı">${grid}
   <path d="${d}" fill="none" stroke="var(--trace)" stroke-width="1.6"/>${marks}
   <text x="${R}" y="${H-2}" text-anchor="end">dk</text><text x="${L}" y="14">MRM · göreli yoğunluk</text></svg></div>
  ${s.note?`<p class="note">${s.note}</p>`:''}
  <div class="criteria"><div class="crit"><b>±0,10 dk</b>Alıkonma zamanı, referans standarda göre</div><div class="crit"><b>±%20</b>İyon oranı (nitel/nicel) sapması, bağıl</div><div class="crit"><b>S/N ≥ 3</b>Sinyal/gürültü, nitel iyon dahil</div></div>
  <div class="peaks">${s.peaks.map((p,k)=>`<div class="peak" id="pk${k}"><div class="peak-top"><span class="pn">${k+1}</span><h3>${p.n}</h3><span class="mrm">${p.mrm}</span></div>
   <div class="pdata"><div>RT (dk)<b>${fmt(p.rt)}</b></div><div>Referans RT<b>${fmt(p.ert)}</b></div><div>S/N<b>${p.sn<10?fmt(p.sn,1):Math.round(p.sn)}</b></div>
   <div>İyon oranı<b>${fmt(p.r)}</b></div><div>Referans oran<b>${fmt(p.er)}</b></div><div class="dv">Sapma<b>?</b></div></div>
   <div class="seg" role="group" aria-label="${p.n} kararı"><button class="y" aria-pressed="false" data-k="${k}" data-v="1">Pozitif</button><button class="n" aria-pressed="false" data-k="${k}" data-v="0">Negatif</button></div>
   <div class="verdict" hidden></div></div>`).join('')}</div>`;
  const pick={};
  const sub=document.createElement('button');sub.className='btn';sub.textContent='Kararları onayla';sub.disabled=true;st.appendChild(sub);
  st.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;pick[k]=b.dataset.v==='1';b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));sub.disabled=Object.keys(pick).length<s.peaks.length});
  st.querySelectorAll('.pm').forEach(g=>g.onclick=()=>{const el=document.getElementById('pk'+g.dataset.k);st.querySelectorAll('.peak').forEach(p=>p.classList.remove('hl'));el.classList.add('hl');el.scrollIntoView({behavior:'smooth',block:'center'})});
  sub.onclick=()=>{sub.remove();let pts=0;
    s.peaks.forEach((p,k)=>{const el=document.getElementById('pk'+k),truth=isPos(p),ok=pick[k]===truth;if(ok)pts+=10;
      el.classList.remove('hl');el.classList.add(ok?'ok':'no');el.querySelectorAll('.seg button').forEach(b=>b.disabled=true);
      const dev=(p.r-p.er)/p.er*100,drt=p.rt-p.ert;
      const dv=el.querySelector('.dv');dv.className=Math.abs(dev)/100<=IR_TOL?'v':'x';dv.querySelector('b').textContent=(dev>0?'+':'')+fmt(dev,0)+'%';
      const why=[];if(Math.abs(drt)>RT_TOL+1e-9)why.push(`RT farkı ${fmt(Math.abs(drt))} dk, tolerans dışı`);if(Math.abs(dev)/100>IR_TOL)why.push(`iyon oranı %${fmt(Math.abs(dev),0)} sapmış`);if(p.sn<SN_MIN)why.push(`S/N ${fmt(p.sn,1)}, tespit sınırının altında`);
      const v=el.querySelector('.verdict');v.hidden=false;
      v.innerHTML=`<b style="color:var(--${ok?'ok':'bad'})">${ok?'Doğru karar':'Hatalı karar'}</b> · ${truth?'Tüm kriterler sağlanıyor, pozitif.':'Negatif: '+why.join('; ')+'.'}`});
    award(s.tag,pts,s.peaks.length*10);
    const fb=document.createElement('div');const mx=s.peaks.length*10;fb.className='fb '+(pts===mx?'good':pts>=mx/2?'part':'poor');
    fb.innerHTML=`<strong>+${pts} puan</strong><span>Pozitif kabul edilen: ${s.peaks.filter(isPos).map(p=>p.n).join(', ')}. Tek bir kriterin bile sağlanmaması tanımlamayı geçersiz kılar.</span>`;
    st.appendChild(fb);nextBtn(st)};
}

function calib(s,st){
  const ans=(s.y-s.b)/s.m,cmax=s.cal[s.cal.length-1];
  const W=600,H=260,L=48,R=584,T=16,B=222,ymax=s.m*cmax+s.b;
  const X=x=>L+x/cmax*(R-L),Y=y=>B-y/ymax*(B-T);
  let seed=11;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const pts=s.cal.map(c=>[c,(s.m*c+s.b)*(1+(rnd()-.5)*.06)]);
  let ax='';for(let k=0;k<=4;k++){const v=cmax*k/4,yv=ymax*k/4;ax+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${B}" stroke="var(--line)"/><text x="${X(v)}" y="${B+16}" text-anchor="middle">${+v.toFixed(2)}</text><text x="${L-6}" y="${Y(yv)+4}" text-anchor="end">${fmt(yv,yv<1?2:1)}</text>`}
  st.innerHTML=`<span class="label">${s.tag}</span><h2>${s.analyte} konsantrasyonu</h2>
  <p class="note">Doğrusal kalibrasyon (1/x ağırlıklı). Numunenin analit/iç standart alan oranından konsantrasyonu hesapla.</p>
  <div class="calib"><div class="calplot"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kalibrasyon eğrisi">${ax}
   <line x1="${X(0)}" y1="${Y(s.b)}" x2="${X(cmax)}" y2="${Y(s.m*cmax+s.b)}" stroke="var(--accent)" stroke-width="2"/>
   ${pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join('')}
   <g id="smp" hidden><line x1="${L}" x2="${X(ans)}" y1="${Y(s.y)}" y2="${Y(s.y)}" stroke="var(--tag)" stroke-dasharray="4 4"/><line x1="${X(ans)}" x2="${X(ans)}" y1="${Y(s.y)}" y2="${B}" stroke="var(--tag)" stroke-dasharray="4 4"/><circle cx="${X(ans)}" cy="${Y(s.y)}" r="7" fill="var(--tag)"/></g>
   <text x="${R}" y="${H-4}" text-anchor="end">${s.unit}</text><text x="${L}" y="${T-4}">alan oranı</text></svg></div>
  <div class="eq"><div><span class="label">Eğim (m)</span><b>${fmt(s.m,4)}</b></div><div><span class="label">Kesişim (b)</span><b>${fmt(s.b,3)}</b></div><div><span class="label">R²</span><b>0,9987</b></div><div><span class="label">Numune oranı (y)</span><b>${fmt(s.y,3)}</b></div></div>
  <p class="note">x = (y − b) / m. Sonucu ${s.unit} olarak gir; ±%3 tolerans kabul edilir.</p>
  <div class="answer"><input id="calin" inputmode="decimal" placeholder="örn. 42,0" aria-label="Konsantrasyon"><span>${s.unit}</span><button class="btn" id="calbtn">Kontrol et</button></div>
  <div id="calfb"></div></div>`;
  let tries=0;const inp=document.getElementById('calin'),btn=document.getElementById('calbtn'),fbw=document.getElementById('calfb');
  const check=()=>{const v=parseFloat(inp.value.replace(',','.'));if(isNaN(v)){fbw.innerHTML=`<div class="fb part"><span>Bir sayı gir, örneğin ${fmt(12.5,1)}.</span></div>`;return}
    tries++;const ok=Math.abs(v-ans)/ans<=.03;
    if(ok||tries>=2){const p=ok?(tries===1?20:10):0;award(s.tag,p,20);inp.disabled=btn.disabled=true;document.getElementById('smp').hidden=false;
      fbw.innerHTML=`<div class="fb ${p===20?'good':p?'part':'poor'}"><strong>+${p} puan · ${ok?'Doğru':'Hatalı'}</strong><span>(${fmt(s.y,3)} − ${fmt(s.b,3)}) / ${fmt(s.m,4)} = <b class="mono">${fmt(ans,1)} ${s.unit}</b>. Sonuç kalibrasyon aralığı (${s.cal[0]}–${cmax} ${s.unit}) içinde; seyreltme gerekmez.</span></div>`;nextBtn(st)}
    else fbw.innerHTML=`<div class="fb poor"><strong>Tekrar dene</strong><span>Önce kesişimi çıkar, sonra eğime böl. Bir hakkın kaldı.</span></div>`};
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}

function final(){
  const c=CASES[S.c],mx=caseMax(c),pct=Math.round(S.score/mx*100);saveBest(c.id,pct);
  const rank=pct>=90?'Laboratuvar sorumlusu':pct>=75?'Uzman toksikolog':pct>=55?'Analist':'Stajyer';
  const agg={};S.log.forEach(l=>{agg[l.tag]=agg[l.tag]||{p:0,m:0};agg[l.tag].p+=l.p;agg[l.tag].m+=l.max});
  app.innerHTML=`<div class="casebar"><button class="back" id="back">← Vakalar</button><span class="caseid">${c.id}</span></div>
  <section class="stage"><span class="label">Vaka kapatıldı · ${c.title}</span>
   <div class="row" style="align-items:flex-end;gap:16px"><div class="final-score">%${pct}</div><div><span class="rank">${rank}</span><p class="mono" style="margin-top:6px;color:var(--muted)">${S.score} / ${mx} puan</p></div></div>
   <table class="logt">${Object.entries(agg).map(([t,v])=>`<tr><td>${t}</td><td>${v.p} / ${v.m}</td></tr>`).join('')}</table>
   <div class="row"><button class="btn" id="again">Vakayı tekrar oyna</button>${S.c<CASES.length-1?`<button class="btn ghost" id="nx">Sonraki vaka →</button>`:''}</div></section>`;
  document.getElementById('back').onclick=home;document.getElementById('again').onclick=()=>start(S.c);
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>start(S.c+1);window.scrollTo(0,0);
}

function lData(L){

  const dx=.002,xs=[];for(let x=L.xr[0];x<=L.xr[1]+1e-9;x+=dx)xs.push(+x.toFixed(4));
  const model=(tr,x)=>{let y=0;L.comps.forEach(c=>{if(c.on!=='both'&&c.on!==tr)return;const h=tr==='q'&&c.on==='both'?c.h*(c.qf??L.er):c.h;const s=x<c.rt?c.sl:c.sr;y+=h*Math.exp(-((x-c.rt)**2)/(2*s*s))});return y};
  const raw=tr=>xs.map(x=>{const d=L.drift[tr];return model(tr,x)+d[0]+d[1]*(x-L.xr[0])+(rnd()+rnd()-1)*L.noise[tr]});

function endAvg(a,i){let s=0,n=0;for(let k=i-3;k<=i+3;k++)if(k>=0&&k<a.length){s+=a[k];n++}return s/n}
function measure(L,D,a,b,base){

    o[tr]={A,H,iH,ya,yb}});
  o.ratio=o.q.A/o.Q.A;o.dev=(o.ratio-L.er)/L.er;o.rec=o.Q.A/trueArea(L);o.rt=D.xs[o.Q.iH];

function taskState(L,m,a,b,base){const t=L.task;if(!t)return null;const w=b-a;
  if(t.needBase&&base!==t.needBase)return{ok:false,msg:`Taban sıfıra çekiliyor; yükselen tabanın altındaki alan da sayılıyor (alan %${fmt(m.rec*100,0)}).`};
  if(m.rec<t.min)return{ok:false,msg:`Alan eksik (%${fmt(m.rec*100,0)}): pencere pikin bir kısmını kesiyor.`};
  if(m.rec>t.max)return{ok:false,msg:`Alan fazla (%${fmt(m.rec*100,0)}): pencere pike ait olmayan sinyali de alıyor.`};
  if(w>t.maxW+1e-9)return{ok:false,msg:`Alan doğru ama pencere ${fmt(w)} dk; ${fmt(t.maxW)} dk'yı aşınca gürültü ve komşu pikler alana girer.`};
  return{ok:true,msg:`Hedefte: alan %${fmt(m.rec*100,0)}, pencere ${fmt(w)} dk.`}}

function lesson(i){
  if(LESSONS[i].type==='snrep')return snLesson(i);
  if(LESSONS[i].type==='matrix')return mLesson(i);
  if(LESSONS[i].type==='carry')return cLesson(i);
  K.i=i;K.pts[i]={};delete K.done[i];
  const L=LESSONS[i],D=lData(L),ert=L.comps[0].rt;
  let a=L.init[0],b=L.init[1],base=L.base||'line',scale=!!L.scaleOn,met=false,qShown=false,drag=null,M;
  const W=640,H=270,PL=40,PR=630,PT=14,PB=236,span=L.xr[1]-L.xr[0];
  const X=x=>PL+(x-L.xr[0])/span*(PR-PL),iX=px=>L.xr[0]+(px-PL)/(PR-PL)*span;
  app.innerHTML=`<div class="casebar"><button class="back" id="back">← Ana sayfa</button><span class="caseid">PİK OKULU ${i+1}/${LESSONS.length}</span>
   <span class="scorebox">Puan <b id="ksc">${kScore()}</b> / ${kMax()}</span></div>
   <ol class="rail">${LESSONS.map((l,k)=>`<li class="${K.done[k]?'done':''} ${k===i?'now':''}">${l.tag}</li>`).join('')}</ol>
   <section class="stage" id="stage">
    <span class="label">Ders ${i+1} · ${L.analyte}</span><h2>${L.title}</h2>
    <div class="theory">${L.theory.map(t=>`<p>${t}</p>`).join('')}</div>
    <div class="rule"><b>Kural</b>${L.rule}</div>
    <div class="legend"><span><i style="background:var(--trace)"></i>Nicel ${L.mrmQ}</span><span><i style="background:var(--qual)"></i>Nitel ${L.mrmq}</span><span>Referans oran ${fmt(L.er)} · RT ${fmt(ert)} dk</span></div>
    <div class="xic"><svg id="xs" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L.analyte} XIC kromatogramı, sürüklenebilir integrasyon penceresi"></svg></div>
    <div class="ctrls">
     <label class="sl"><span>Başlangıç</span><input type="range" id="sa" min="${L.xr[0]}" max="${L.xr[1]}" step="0.002"><output id="oa"></output></label>
     <label class="sl"><span>Bitiş</span><input type="range" id="sb" min="${L.xr[0]}" max="${L.xr[1]}" step="0.002"><output id="ob"></output></label>
     <div class="toggles">${L.baseToggle?`<button class="tg" id="tb0" aria-pressed="false">Taban: sıfır</button><button class="tg" id="tb1" aria-pressed="false">Taban: doğrusal</button>`:''}
      ${L.scaleToggle?`<button class="tg" id="tsc" aria-pressed="false">Nitel iyonu ölçekle (÷${fmt(L.er)})</button>`:''}</div>
    </div>
    <div class="readout" id="ro"></div>
    <div class="task" id="tk"></div>
    <div id="qz"></div>
   </section>`;
  document.getElementById('back').onclick=home;
  const svg=document.getElementById('xs'),sa=document.getElementById('sa'),sb=document.getElementById('sb');
  function draw(){
    const f=scale?1/L.er:1,ym=Math.max(...D.Q,...D.q.map(v=>v*f))*1.12,Y=v=>PB-v/ym*(PB-PT);
    const path=(arr,k=1)=>arr.map((v,j)=>(j?'L':'M')+X(D.xs[j]).toFixed(1)+' '+Y(v*k).toFixed(1)).join('');
    const step=span>.42?.1:.05;let g='';
    for(let t=Math.ceil(L.xr[0]/step-1e-9)*step;t<=L.xr[1]+1e-9;t+=step)g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${PT}" y2="${PB}" stroke="var(--scope-grid)"/><text x="${X(t)}" y="${PB+16}" text-anchor="middle">${fmt(t)}</text>`;
    for(let k=0;k<=4;k++){const y=PT+k*(PB-PT)/4;g+=`<line x1="${PL}" x2="${PR}" y1="${y}" y2="${y}" stroke="var(--scope-grid)"/>`}
    const ia=idx(D,a),ib=idx(D,b);
    const shade=(tr,k,col,op)=>{const y=D[tr],m=M[tr];let p='';for(let j=ia;j<=ib;j++)p+=(j===ia?'M':'L')+X(D.xs[j]).toFixed(1)+' '+Y(y[j]*k).toFixed(1);
      return `<path d="${p}L${X(D.xs[ib]).toFixed(1)} ${Y(m.yb*k).toFixed(1)}L${X(D.xs[ia]).toFixed(1)} ${Y(m.ya*k).toFixed(1)}Z" fill="${col}" fill-opacity="${op}"/>`};
    const nr=L.noiseRegion?`<rect x="${X(L.noiseRegion[0])}" y="${PT}" width="${X(L.noiseRegion[1])-X(L.noiseRegion[0])}" height="${PB-PT}" fill="var(--scope-ink)" fill-opacity=".09"/><text x="${(X(L.noiseRegion[0])+X(L.noiseRegion[1]))/2}" y="${PT+14}" text-anchor="middle">gürültü bölgesi</text>`:'';
    const hd=(x,lab)=>`<line x1="${X(x)}" x2="${X(x)}" y1="${PT}" y2="${PB}" stroke="var(--tag)" stroke-width="2"/><rect x="${X(x)-13}" y="${PT}" width="26" height="22" rx="5" fill="var(--tag)"/><text x="${X(x)}" y="${PT+15}" text-anchor="middle" style="fill:var(--tag-ink);font-weight:600">${lab}</text>`;
    svg.innerHTML=`${g}${nr}${shade('Q',1,'var(--trace)',.22)}${shade('q',f,'var(--qual)',.22)}
     <path d="${path(D.q,f)}" fill="none" stroke="var(--qual)" stroke-width="1.5" ${scale?'stroke-dasharray="5 3"':''}/>
     <path d="${path(D.Q)}" fill="none" stroke="var(--trace)" stroke-width="1.8"/>
     <line x1="${X(D.xs[ia])}" y1="${Y(M.Q.ya)}" x2="${X(D.xs[ib])}" y2="${Y(M.Q.yb)}" stroke="var(--scope-ink)" stroke-width="1.4" stroke-dasharray="3 3"/>
     ${hd(a,'B')}${hd(b,'S')}<text x="${PR}" y="${H-4}" text-anchor="end">dk</text><text x="${PL+4}" y="${PB-6}">${scale?'nitel ×'+fmt(1/L.er,1):''}</text>`;
  }
  function update(){
    M=measure(L,D,a,b,base);draw();
    sa.value=a;sb.value=b;document.getElementById('oa').textContent=fmt(a,3);document.getElementById('ob').textContent=fmt(b,3);
    if(L.baseToggle){document.getElementById('tb0').setAttribute('aria-pressed',base==='zero');document.getElementById('tb1').setAttribute('aria-pressed',base==='line')}
    if(L.scaleToggle)document.getElementById('tsc').setAttribute('aria-pressed',scale);
    const rtOk=Math.abs(M.rt-ert)<=RT_TOL,irOk=Math.abs(M.dev)<=IR_TOL,cnt=v=>Math.round(v*2e5).toLocaleString('tr-TR');
    const snOk=L.showSN?(M.Q.sn>=SN_MIN&&M.q.sn>=SN_MIN):null;
    const ch=(ok,t)=>`<span class="chip ${ok?'ok':'bad'}">${t}</span>`;
    let h=`<div>RT (tepe)<b>${fmt(M.rt)} dk ${ch(rtOk,rtOk?'✓':'✗')}</b></div>
      <div>Nicel alan<b>${cnt(M.Q.A)}</b></div><div>Nitel alan<b>${cnt(M.q.A)}</b></div>
      <div>İyon oranı (ref ${fmt(L.er)})<b>${fmt(M.ratio)} ${ch(irOk,(M.dev>0?'+':'')+fmt(M.dev*100,0)+'%')}</b></div>`;
    if(L.task)h+=`<div>Gerçek alana göre<b>%${fmt(M.rec*100,1)}</b></div>`;
    if(L.calc){const cc=M.rec*L.calc.true;h+=`<div>Nicel iyondan hesap<b>${fmt(cc,2)} ${L.calc.unit} ${ch(cc>=L.calc.loq,'LOQ '+fmt(L.calc.loq,1))}</b></div>`}
    if(L.showAs){const c=L.comps[0];h+=`<div>Asimetri As (%10)<b>${fmt(c.sr/c.sl,1)} ${ch(false,'>1,5')}</b></div>`}
    if(L.showSN)h+=`<div>S/N nicel<b>${fmt(M.Q.sn,0)} ${ch(M.Q.sn>=SN_MIN,M.Q.sn>=SN_MIN?'✓':'✗')}</b></div><div>S/N nitel<b>${fmt(M.q.sn,1)} ${ch(M.q.sn>=SN_MIN,M.q.sn>=SN_MIN?'✓':'✗')}</b></div>`;
    const idOk=rtOk&&irOk&&(snOk!==false);
    h+=`<div>Tanımlama<b>${idOk?ch(true,'Kriterler sağlanıyor'):ch(false,'Kriter dışı')}</b></div>`;
    document.getElementById('ro').innerHTML=h;
    const tk=document.getElementById('tk'),ts=taskState(L,M,a,b,base);
    if(ts){tk.className='task'+(ts.ok?' met':'');tk.innerHTML=`<span class="label">Görev</span><span>${L.task.text}</span><span class="st">${ts.ok?'✓ ':''}${ts.msg}</span>`;
      if(ts.ok&&!met){met=true;K.pts[i].t=10;document.getElementById('ksc').textContent=kScore()}}
    else tk.innerHTML=`<span class="label">Keşfet</span><span>${L.explore}</span>`;
    if((met||!L.task)&&!qShown){qShown=true;lessonQ(L,i)}
  }
  const setX=(which,x)=>{x=Math.max(L.xr[0],Math.min(L.xr[1],x));if(which==='a')a=Math.min(x,b-.01);else b=Math.max(x,a+.01);update()};
  const toVB=e=>{const r=svg.getBoundingClientRect();return (e.clientX-r.left)/r.width*W};
  svg.addEventListener('pointerdown',e=>{const px=toVB(e);drag=Math.abs(px-X(a))<=Math.abs(px-X(b))?'a':'b';try{svg.setPointerCapture(e.pointerId)}catch(_){};setX(drag,iX(px))});
  svg.addEventListener('pointermove',e=>{if(drag)setX(drag,iX(toVB(e)))});
  ['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>drag=null));
  sa.oninput=()=>setX('a',+sa.value);sb.oninput=()=>setX('b',+sb.value);
  if(L.baseToggle){document.getElementById('tb0').onclick=()=>{base='zero';update()};document.getElementById('tb1').onclick=()=>{base='line';update()}}
  if(L.scaleToggle)document.getElementById('tsc').onclick=()=>{scale=!scale;update()};
  update();window.scrollTo(0,0);
}
function kHead(i){return `<div class="casebar"><button class="back" id="back">← Ana sayfa</button><span class="caseid">PİK OKULU ${i+1}/${LESSONS.length}</span>
 <span class="scorebox">Puan <b id="ksc">${kScore()}</b> / ${kMax()}</span></div>
 <ol class="rail">${LESSONS.map((l,k)=>`<li class="${K.done[k]?'done':''} ${k===i?'now':''}">${l.tag}</li>`).join('')}</ol>`}
function kIntro(i,L){return `<span class="label">Ders ${i+1} · ${L.analyte}</span><h2>${L.title}</h2><div class="theory">${L.theory.map(t=>`<p>${t}</p>`).join('')}</div><div class="rule"><b>Kural</b>${L.rule}</div>`}
function kTask(i,ok,msg,text){const tk=document.getElementById('tk');tk.className='task'+(ok?' met':'');tk.innerHTML=`<span class="label">Görev</span><span>${text}</span><span class="st">${ok?'✓ ':''}${msg}</span>`;
  if(ok&&!K.pts[i].t){K.pts[i].t=10;document.getElementById('ksc').textContent=kScore()}}

/* S/N tekrar deneyi */
function snSim(L,c,seed){const Lx=Object.assign({},L,{seed,comps:[G(L.rt,L.sig,c*L.hPer,'both')]});const D=lData(Lx);
  return {D,m:measure(Lx,D,L.rt-3*L.sig,L.rt+3*L.sig,'line')}}
function snStats(L,c){let sn=0,ib=0;const pts=[];for(let k=0;k<40;k++){const {m}=snSim(L,c,L.seed*7+k*131+1);pts.push(m);if(m.q.sn>=SN_MIN)sn++;if(Math.abs(m.dev)<=IR_TOL)ib++}return{pts,sn:sn/40,ib:ib/40}}
function snLesson(i){
  K.i=i;K.pts[i]={};delete K.done[i];const L=LESSONS[i];let c=L.c0,inj=0,qShown=false;
  let lod=null;for(let x=.5;x<=10;x+=.5){if(snStats(L,x).sn>=.95){lod=x;break}}
  app.innerHTML=kHead(i)+`<section class="stage">${kIntro(i,L)}
   <div class="legend"><span><i style="background:var(--qual)"></i>Nitel ${L.mrmq}</span><span>Gri bölge: gürültü ölçümü · sarı çizgiler: sabit pencere</span></div>
   <div class="xic"><svg id="xs" viewBox="0 0 640 250" role="img" aria-label="Nitel iyon XIC"></svg></div>
   <div class="ctrls"><label class="sl"><span>Konsantr.</span><input type="range" id="cs" min="0" max="10" step="0.5"><output id="co"></output></label>
    <div class="toggles"><button class="tg" id="rj">Yeniden enjekte et</button></div></div>
   <div class="readout" id="ro"></div>
   <span class="label">40 tekrar enjeksiyonda iyon oranı (nitel / nicel)</span>
   <div class="calplot"><svg id="scp" viewBox="0 0 640 230" role="img" aria-label="40 tekrarın iyon oranı dağılımı"></svg></div>
   <div class="legend"><span>Bant: referans oran ${fmt(L.er)} ±%20</span><span>● nitel S/N ≥ 3 · ○ nitel S/N &lt; 3</span></div>
   <div class="task" id="tk"></div><div id="qz"></div></section>`;
  document.getElementById('back').onclick=home;
  const cs=document.getElementById('cs');
  function drawX(D){const W=640,H=250,PL=40,PR=630,PT=14,PB=216,span=L.xr[1]-L.xr[0],X=x=>PL+(x-L.xr[0])/span*(PR-PL);
    const ym=Math.max(...D.q,.12)*1.15,Y=v=>PB-v/ym*(PB-PT);let g='';
    for(let t=2.9;t<=3.3001;t+=.1)g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${PT}" y2="${PB}" stroke="var(--scope-grid)"/><text x="${X(t)}" y="${PB+16}" text-anchor="middle">${fmt(t)}</text>`;
    const nr=L.noiseRegion,a=L.rt-3*L.sig,b=L.rt+3*L.sig;
    document.getElementById('xs').innerHTML=`${g}<rect x="${X(nr[0])}" y="${PT}" width="${X(nr[1])-X(nr[0])}" height="${PB-PT}" fill="var(--scope-ink)" fill-opacity=".09"/><text x="${(X(nr[0])+X(nr[1]))/2}" y="${PT+14}" text-anchor="middle">gürültü bölgesi</text>
     <line x1="${X(a)}" x2="${X(a)}" y1="${PT}" y2="${PB}" stroke="var(--tag)" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="${X(b)}" x2="${X(b)}" y1="${PT}" y2="${PB}" stroke="var(--tag)" stroke-width="1.5" stroke-dasharray="4 3"/>
     <path d="${D.q.map((v,j)=>(j?'L':'M')+X(D.xs[j]).toFixed(1)+' '+Y(v).toFixed(1)).join('')}" fill="none" stroke="var(--qual)" stroke-width="1.6"/><text x="${PR}" y="${H-4}" text-anchor="end">dk</text>`}
  function drawS(st){const W=640,H=230,PL=44,PR=628,PT=12,PB=200,ymx=L.er*3,Y=v=>PB-Math.max(0,Math.min(ymx,v))/ymx*(PB-PT),X=k=>PL+(k+.5)/40*(PR-PL);
    let g='';for(let k=0;k<=3;k++){const v=L.er*k;g+=`<line x1="${PL}" x2="${PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${PL-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
    g+=`<rect x="${PL}" y="${Y(L.er*1.2)}" width="${PR-PL}" height="${Y(L.er*.8)-Y(L.er*1.2)}" fill="var(--ok)" fill-opacity=".16"/><line x1="${PL}" x2="${PR}" y1="${Y(L.er)}" y2="${Y(L.er)}" stroke="var(--ok)" stroke-dasharray="4 3"/>`;
    g+=st.pts.map((m,k)=>{const inb=Math.abs(m.dev)<=IR_TOL,col=inb?'var(--ok)':'var(--bad)',full=m.q.sn>=SN_MIN;return `<circle cx="${X(k)}" cy="${Y(m.ratio)}" r="5" fill="${full?col:'var(--sunk)'}" stroke="${col}" stroke-width="2"/>`}).join('');
    g+=`<text x="${PR}" y="${H-8}" text-anchor="end">tekrar enjeksiyon 1 → 40</text>`;document.getElementById('scp').innerHTML=g}
  function update(){cs.value=c;document.getElementById('co').textContent=fmt(c,1)+' ng/mL';
    const one=snSim(L,c,L.seed+inj*977),st=snStats(L,c),m=one.m;drawX(one.D);drawS(st);
    const ch=(ok,t)=>`<span class="chip ${ok?'ok':'bad'}">${t}</span>`;
    let h=`<div>Bu enjeksiyon: S/N nicel<b>${fmt(m.Q.sn,1)}</b></div><div>Bu enjeksiyon: S/N nitel<b>${fmt(m.q.sn,1)} ${ch(m.q.sn>=SN_MIN,m.q.sn>=SN_MIN?'✓':'✗')}</b></div>
     <div>Bu enjeksiyon: oran<b>${c?fmt(m.ratio):'—'} ${c?ch(Math.abs(m.dev)<=IR_TOL,(m.dev>0?'+':'')+fmt(m.dev*100,0)+'%'):''}</b></div>
     <div>40 tekrar: nitel S/N ≥ 3<b>%${fmt(st.sn*100,0)}</b></div><div>40 tekrar: oran toleransta<b>%${fmt(st.ib*100,0)}</b></div>`;
    if(c===0)h+=`<div>Blank: gürültü "piki" S/N ≥ 3<b>${Math.round(st.sn*40)} / 40 ${ch(false,'yanlış pozitif')}</b></div>`;
    document.getElementById('ro').innerHTML=h;
    const ok=lod!==null&&c===lod;
    kTask(i,ok,ok?`Hedefte: ${fmt(c,1)} ng/mL'de tekrarların %${fmt(st.sn*100,0)}'i S/N ≥ 3. Bir alt düzeyde bu oran %95'in altına düşüyor.`:st.sn>=.95?`Tekrarların %${fmt(st.sn*100,0)}'i S/N ≥ 3, ama daha düşük bir konsantrasyon da yetebilir.`:`Tekrarların yalnızca %${fmt(st.sn*100,0)}'i S/N ≥ 3. Daha yükseğe çık.`,L.task.text);
    if(!qShown&&(K.pts[i].t||c>=6)){qShown=true;lessonQ(L,i)}}
  cs.oninput=()=>{c=+cs.value;update()};document.getElementById('rj').onclick=()=>{inj++;update()};
  update();window.scrollTo(0,0);
}

/* Matriks etkisi */
function mLesson(i){
  K.i=i;K.pts[i]={};delete K.done[i];const L=LESSONS[i];
  const ISS={d3:{n:'Morfin-d₃',rt:1.79,lab:'izotop'},an:{n:'Nalorfin',rt:2.42,lab:'yapısal analog'},no:{n:'Yok',rt:null,lab:''}};
  let is='no',cal='meoh',load=70,qShown=false;
  const S=(t,d)=>1-d*Math.exp(-((t-1.80)**2)/(2*.07*.07))-.5*Math.exp(-((t-.72)**2)/(2*.05*.05));
  app.innerHTML=kHead(i)+`<section class="stage">${kIntro(i,L)}
   <div class="legend"><span><i style="background:var(--trace)"></i>Numune ekstraktı</span><span><i style="background:var(--qual)"></i>Kalibratör matriksi</span><span>Post-kolon infüzyon, morfin yanıtı (%)</span></div>
   <div class="xic"><svg id="ms" viewBox="0 0 640 260" role="img" aria-label="Post-kolon infüzyon kromatogramı"></svg></div>
   <div class="ctrls">
    <div class="toggles"><span class="label" style="align-self:center">İç standart</span>${Object.entries(ISS).map(([k,v])=>`<button class="tg" data-is="${k}">${v.n}${v.lab?' · '+v.lab:''}</button>`).join('')}</div>
    <div class="toggles"><span class="label" style="align-self:center">Kalibrasyon</span><button class="tg" data-cal="meoh">MeOH içinde</button><button class="tg" data-cal="mm">Matriks-eşli (blank kan)</button></div>
    <label class="sl"><span>Matriks yükü</span><input type="range" id="ml" min="0" max="100" step="5"><output id="mo"></output></label>
   </div>
   <div class="readout" id="ro"></div><div class="task" id="tk"></div><div id="qz"></div></section>`;
  document.getElementById('back').onclick=home;const ml=document.getElementById('ml');
  function update(){
    const ds=load/100*.8,dc=cal==='mm'?.35:0,I=ISS[is];
    const mfa=S(L.rt,ds),mfi=I.rt?S(I.rt,ds):1,mfac=S(L.rt,dc),mfic=I.rt?S(I.rt,dc):1;
    const conc=100*(mfa/mfi)/(mfac/mfic),bias=conc/100-1;
    const W=640,H=260,PL=44,PR=628,PT=14,PB=224,x0=.4,x1=3.0,X=t=>PL+(t-x0)/(x1-x0)*(PR-PL),Y=v=>PB-v/1.15*(PB-PT);
    let seed=L.seed;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
    const tr=d=>{let p='';for(let t=x0;t<=x1+1e-9;t+=.005)p+=(p?'L':'M')+X(t).toFixed(1)+' '+Y(S(t,d)+(rnd()-.5)*.025).toFixed(1);return p};
    let g='';for(let t=.5;t<=3.0001;t+=.5)g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${PT}" y2="${PB}" stroke="var(--scope-grid)"/><text x="${X(t)}" y="${PB+16}" text-anchor="middle">${fmt(t,1)}</text>`;
    [0,.5,1].forEach(v=>g+=`<line x1="${PL}" x2="${PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--scope-grid)"/><text x="${PL-6}" y="${Y(v)+4}" text-anchor="end">${v*100}</text>`);
    const mk=(t,col,lab,dy)=>`<line x1="${X(t)}" x2="${X(t)}" y1="${PT+18}" y2="${PB}" stroke="${col}" stroke-width="2"/><text x="${X(t)+(t>2.6?-4:4)}" y="${PT+12+dy}" ${t>2.6?'text-anchor="end"':''} style="fill:${col};font-weight:600">${lab}</text>`;
    document.getElementById('ms').innerHTML=`${g}<path d="${tr(dc)}" fill="none" stroke="var(--qual)" stroke-width="1.4" ${cal==='meoh'?'stroke-dasharray="5 4"':''}/><path d="${tr(ds)}" fill="none" stroke="var(--trace)" stroke-width="1.8"/>

    if(!qShown&&K.pts[i].t){qShown=true;lessonQ(L,i)}}

function cLesson(i){
  K.i=i;K.pts[i]={};delete K.done[i];const L=LESSONS[i];
  let wash='weak',extra=false,sel=null,qShown=false;
  app.innerHTML=kHead(i)+`<section class="stage">${kIntro(i,L)}
   <div class="ctrls"><div class="toggles"><span class="label" style="align-self:center">İğne yıkama</span><button class="tg" data-w="weak">Zayıf (%10 MeOH)</button><button class="tg" data-w="strong">Güçlü (ACN:IPA:su + asit)</button></div>
    <div class="toggles"><button class="tg" id="xb">Numune A'dan sonra blank ekle</button></div></div>
   <span class="label">Enjeksiyon sırası · LLOQ ${L.lloq} · ULOQ ${L.uloq} ng/mL · blank kriteri &lt; ${fmt(L.lloq*.2,1)} ng/mL</span>
   <div class="seq" id="sq"></div>
   <div class="legend" id="xl"></div>
   <div class="xic"><svg id="cx" viewBox="0 0 640 210" role="img" aria-label="Seçili enjeksiyonun XIC'si"></svg></div>
   <div class="task" id="tk"></div><div id="qz"></div></section>`;
  document.getElementById('back').onclick=home;
  function seq(){const r=[{n:'Çift blank',t:0,k:'blank'},{n:'Sıfır blank (matriks + İS)',t:0,k:'blank'},{n:'Kalibratör 1 (LLOQ)',t:5,k:'cal'},{n:'Kalibratör 6 (ULOQ)',t:500,k:'cal'},{n:'Blank',t:0,k:'blank'},{n:'Numune A',t:4800,k:'smp'}];
    if(extra)r.push({n:'Blank (eklenen)',t:0,k:'blank'});r.push({n:'Numune B',t:0,k:'smp',b:1},{n:'Numune C',t:30,k:'smp'});
    const f=wash==='weak'?.0025:.0002;let prev=0;r.forEach(x=>{x.m=x.t+f*prev;prev=x.m});return r}
  function xic(x){const W=640,H=210,PL=40,PR=630,PT=12,PB=180,x0=1.6,x1=2.0,X=t=>PL+(t-x0)/(x1-x0)*(PR-PL);
    let seed=17+(x?Math.round(x.m*7):0);const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
    const h=x?x.m/L.lloq:0,ys=[];for(let t=x0;t<=x1+1e-9;t+=.002)ys.push([t,h*Math.exp(-((t-1.8)**2)/(2*.022*.022))+.02+(rnd()+rnd()-1)*.04]);
    const ym=Math.max(h,.35)*1.15,Y=v=>PB-v/ym*(PB-PT);let g='';
    for(let t=1.6;t<=2.0001;t+=.1)g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${PT}" y2="${PB}" stroke="var(--scope-grid)"/><text x="${X(t)}" y="${PB+16}" text-anchor="middle">${fmt(t)}</text>`;
    g+=`<line x1="${PL}" x2="${PR}" y1="${Y(1.02)}" y2="${Y(1.02)}" stroke="var(--tag)" stroke-dasharray="4 4"/><text x="${PL+4}" y="${Y(1.02)-4}" style="fill:var(--tag)">LLOQ yüksekliği</text>`;
    g+=`<path d="${ys.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="var(--trace)" stroke-width="1.6"/>`;
    g+=`<text x="${PR}" y="${PT+12}" text-anchor="end">${x?x.n+' · '+fmt(x.m,x.m<10?2:0)+' ng/mL':''}</text><text x="${PR}" y="${H-4}" text-anchor="end">dk</text>`;
    document.getElementById('cx').innerHTML=g}
  function update(){
    const r=seq(),ch=(ok,t)=>`<span class="chip ${ok?'ok':'bad'}">${t}</span>`,lim=L.lloq*.2,mx=Math.log10(1+5000);
    document.getElementById('sq').innerHTML=r.map((x,k)=>{let v='';
      if(x.k==='blank')v=ch(x.m<lim,`%${fmt(x.m/L.lloq*100,0)} LLOQ`);
      else if(x.k==='cal')v=`<span class="chip ok">kalibratör</span>`;
      else if(x.t>L.uloq)v=ch(false,'ULOQ üstü · seyrelt');
      else if(x.b)v=x.m>=L.lloq?ch(false,'pozitif? (gerçek 0)'):x.m>=lim?ch(false,'şüpheli sinyal'):ch(true,'temiz');
      else v=ch(true,x.m>=L.lloq?'pozitif':'negatif');
      return `<button class="seqrow${sel===k?' on':''}" data-k="${k}"><span class="mono">${k+1}</span><span class="sn">${x.n}</span><span class="bar"><i style="width:${Math.log10(1+x.m)/mx*100}%"></i></span><span class="mono sv">${fmt(x.m,x.m<10?2:0)}</span><span>${v}</span></button>`}).join('');
    document.querySelectorAll('.seqrow').forEach(b=>b.onclick=()=>{sel=+b.dataset.k;update()});
    document.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.w===wash));
    document.getElementById('xb').setAttribute('aria-pressed',extra);
    document.getElementById('xl').innerHTML=`<span>Çubuklar logaritmik ölçekte · ölçülen ng/mL</span><span>Taşınma oranı bu ayarda: %${fmt((wash==='weak'?.0025:.0002)*100,2)}</span>`;
    xic(sel!==null?r[sel]:r.find(x=>x.b));
    const blanksOk=r.filter(x=>x.k==='blank').every(x=>x.m<lim),B=r.find(x=>x.b),ok=blanksOk&&B.m<lim;
    kTask(i,ok,ok?'Hedefte: tüm blanklar temiz, Numune B etkilenmiyor.':!blanksOk?'En az bir blank kriteri geçemiyor; sistem taşıma yapıyor.':`Blanklar temiz ama Numune B'de ${fmt(B.m,2)} ng/mL taşınma sinyali var.`,L.task.text);
    if(!qShown&&K.pts[i].t){qShown=true;lessonQ(L,i)}}
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{wash=b.dataset.w;update()});
  document.getElementById('xb').onclick=()=>{extra=!extra;sel=null;update()};
  update();window.scrollTo(0,0);
}
function lessonQ(L,i){
  const s=L.q,box=document.getElementById('qz');box.style.cssText='display:flex;flex-direction:column;gap:14px';
  box.innerHTML=`<span class="label">Karar</span><p class="q">${s.q}</p><div class="opts">${s.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${'ABCD'[k]}</span><span>${o.t}</span></button>`).join('')}</div>`;
  const best=Math.max(...s.opts.map(o=>o.p));
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=s.opts[+b.dataset.k];
    box.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(s.opts[k].p===best)x.classList.add('right')});if(o.p!==best)b.classList.add('wrong');
    K.pts[i].q=o.p;K.done[i]=((K.pts[i].t||0)+o.p)+'/'+((L.task?10:0)+best);document.getElementById('ksc').textContent=kScore();
    const fb=document.createElement('div');fb.className='fb '+(o.p===best?'good':o.p>=best/2?'part':'poor');
    fb.innerHTML=`<strong>+${o.p} puan · ${o.p===best?'Doğru':o.p>0?'Kısmen':'Hatalı'}</strong><span>${o.f}</span>${o.p!==best?`<span><b>En iyi seçim:</b> ${s.opts.find(x=>x.p===best).f}</span>`:''}`;
    box.appendChild(fb);
    const nb=document.createElement('button');nb.className='btn';const last=i===LESSONS.length-1;nb.textContent=last?'Okulu bitir, vakalara geç →':'Sonraki ders →';
    nb.onclick=()=>last?home():lesson(i+1);box.appendChild(nb);nb.focus({preventScroll:true});nb.scrollIntoView({behavior:'smooth',block:'nearest'})});
}

 if(nx&&nx.st!==c.st&&L.mode==='guide')L.msg.t+=` Sıradaki adım "${STATIONS[nx.st]}" bölümünde.`;
 labRender()}
function labFinal(){const L=LB;let rec=1,vol=1,dil=1,split=0,dirty=0,pen=0;const flags=[];
 LSTEPS.forEach(s=>{const o=L.ch[s.id];if(!o)return;rec*=o.rec||1;vol*=o.vol||1;dil*=o.dil||1;split|=o.split||0;dirty|=o.dirty||0;pen+=o.ok===2?0:o.ok===1?5:10;if(o.flag)flags.push(o.flag)});
 const absRec=.88*rec,h=absRec*vol*dil*(dirty?.6:1),sn=Math.round(70*h/(dirty?2.5:1)),conc=250*vol;
 const score=Math.max(0,100-pen-3*L.mist-2*L.hints);
 let seed=5;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
 const W=640,H=220,PL=36,PR=628,PT=14,PB=190,x0=1.5,x1=2.1,X=t=>PL+(t-x0)/(x1-x0)*(PR-PL);
 const pts=[];for(let t=x0;t<=x1;t+=.002){let y=split?h*.55*Math.exp(-((t-1.765)**2)/(2*.02*.02))+h*.5*Math.exp(-((t-1.81)**2)/(2*.022*.022)):h*Math.exp(-((t-1.8)**2)/(2*.022*.022));
   y+=.02+(rnd()+rnd()-1)*(dirty?.05:.012)+(dirty?.12*Math.exp(-((t-1.7)**2)/(2*.08*.08)):0);pts.push([t,y])}
 const ym=Math.max(1,...pts.map(p=>p[1]))*1.1,Y=v=>PB-v/ym*(PB-PT);
 let g='';for(let t=1.5;t<=2.1001;t+=.1)g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${PT}" y2="${PB}" stroke="var(--scope-grid)"/><text x="${X(t)}" y="${PB+16}" text-anchor="middle">${fmt(t)}</text>`;
 g+=`<path d="${pts.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="var(--trace)" stroke-width="1.8"/><text x="${PR}" y="${PT+12}" text-anchor="end">Morfin 286,1 → 165,1</text>`;
 const ch=(ok,t)=>`<span class="chip ${ok?'ok':'bad'}">${t}</span>`;
 const notes=[];
 if(rec<.95)notes.push(`Mutlak geri kazanım %${fmt(absRec*100,0)}'e düştü. İç standart ekstraksiyondan önce eklendiği için aynı kaybı yaşadı; analit/İS oranı ve hesaplanan konsantrasyon yine doğru. Bedeli duyarlılık: S/N ve LOQ kötüleşir.`);
 if(vol!==1)notes.push(`Numune hacmi yanlış (${fmt(vol,1)} mL). İç standart sabit miktarda eklendiği için bu hata düzeltilmez: sonuç ${fmt(conc,0)} ng/mL çıktı, gerçek değer 250.`);
 if(dil!==1)notes.push('Ekstrakt 10 kat seyreltildi. Konsantrasyon doğru hesaplanır ama pik küçüldü; düşük düzeyli analitler LOQ altına düşebilir.');
 if(split)notes.push('Saf metanolde rekonstitüsyon pik şeklini bozdu (yarılma ve öne yatma). Bu pik integrasyonda sorun çıkarır; Pik Okulu Ders 1–2.');
 if(dirty)notes.push('Yıkama atlandı: taban gürültülü, analitin önünde bir matriks tümseği var ve yanıt baskılandı. Pik Okulu Ders 3 ve 10.');
 if(!notes.length)notes.push('Temiz ekstrakt, keskin pik, yüksek geri kazanım. Bu kromatogram doğrudan integrasyona hazır.');
 app.innerHTML=`<div class="casebar"><button class="back" id="back">← Ana sayfa</button><span class="caseid">LAB · Tamamlandı</span></div>
  <section class="stage"><span class="label">Örnek hazırlama sonucu · TX-26-0417 femoral kan</span>
   <div class="row" style="align-items:flex-end;gap:16px"><div class="final-score">${score}</div><div><span class="rank">${score>=90?'Bağımsız çalışabilir':score>=70?'Gözetimle çalışabilir':'Tekrar eğitimi'}</span><p class="mono" style="margin-top:6px;color:var(--muted)">100 üzerinden · hata ${L.mist} · ipucu ${L.hints}</p></div></div>
   <div class="xic"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Senin ekstraktının kromatogramı">${g}</svg></div>
   <div class="readout"><div>Mutlak geri kazanım<b>%${fmt(absRec*100,0)}</b></div><div>S/N<b>${sn} ${ch(sn>=10,sn>=10?'LOQ üstü':'LOQ altı')}</b></div><div>Hesaplanan (gerçek 250)<b>${fmt(conc,0)} ng/mL ${ch(vol===1,vol===1?'doğru':'hatalı')}</b></div><div>Pik şekli<b>${split?ch(false,'bozuk'):ch(true,'keskin')}</b></div></div>
   <div class="theory">${notes.map(n=>`<p>${n}</p>`).join('')}</div>
   ${flags.length?`<div class="rule"><b>Kalite / güvenlik kayıtları</b>${flags.join(' · ')}</div>`:''}
   <table class="logt">${LSTEPS.filter(s=>s.ch).map(s=>{const o=L.ch[s.id];return `<tr><td>${s.t}<br><small style="color:var(--muted)">${o.t}</small></td><td>${o.ok===2?'✓':o.ok===1?'~':'✗'}</td></tr>`}).join('')}</table>
   <div class="row"><button class="btn" id="again">Tekrar dene</button><button class="btn ghost" id="exam">${L.mode==='guide'?'Sınav modunda dene':'Rehberli moda geç'}</button></div></section>`;
 document.getElementById('back').onclick=home;document.getElementById('again').onclick=()=>labStart(L.mode);
 document.getElementById('exam').onclick=()=>labStart(L.mode==='guide'?'exam':'guide');window.scrollTo(0,0)}

home();
</script>
